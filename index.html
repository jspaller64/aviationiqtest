  let eng = null;
  function startEngine(){
    if(!soundOn) return; const a=ac(); if(!a||eng) return;
    const p=curProfile;
    const o1=a.createOscillator(), o2=a.createOscillator();
    o1.type=p.osc; o2.type=p.osc;
    o1.frequency.value=p.baseF; o2.frequency.value=p.baseF*p.detune;
    const filt=a.createBiquadFilter(); filt.type="lowpass"; filt.frequency.value=p.filt; filt.Q.value=p.q;
    const trem=a.createGain(); trem.gain.value=0.82;         // steady level, modulated by LFO
    const out=a.createGain();  out.gain.value=0;             // engine master volume
    o1.connect(filt); o2.connect(filt); filt.connect(trem); trem.connect(out); out.connect(a.destination);
    const lfo=a.createOscillator(); lfo.type=p.lfoType||"sine"; lfo.frequency.value=p.lfo;
    const lg=a.createGain(); lg.gain.value=p.depth; lfo.connect(lg); lg.connect(trem.gain);
    // wind rush: looping noise through a bandpass, grows with the dive
    const nb=a.createBuffer(1,(a.sampleRate*2)|0,a.sampleRate);
    const nd=nb.getChannelData(0); for(let i=0;i<nd.length;i++) nd[i]=Math.random()*2-1;
    const noise=a.createBufferSource(); noise.buffer=nb; noise.loop=true;
    const wbp=a.createBiquadFilter(); wbp.type="bandpass"; wbp.frequency.value=p.windFc; wbp.Q.value=0.6;
    const wind=a.createGain(); wind.gain.value=p.wind;
    noise.connect(wbp); wbp.connect(wind); wind.connect(a.destination);
    // optional turbine whine
    let whine=null, whineGain=null;
    if(p.whine){
      whine=a.createOscillator(); whine.type=p.whine.osc; whine.frequency.value=p.whine.f;
      whineGain=a.createGain(); whineGain.gain.value=p.whine.vol;
      whine.connect(whineGain); whineGain.connect(a.destination); whine.start();
    }
    o1.start(); o2.start(); lfo.start(); noise.start();
    const t=a.currentTime; out.gain.setValueAtTime(0,t); out.gain.linearRampToValueAtTime(p.vol,t+0.2);
    eng={o1,o2,filt,trem,out,lfo,lg,noise,wbp,wind,whine,whineGain,p};
    if(p.rotor) startRotor(a,p);
  }
  // Impulsive two-blade rotor slap (Huey): a sharp low thwop + click fired on the beat,
  // alternating strong/weak for the classic "whop-whop".
  function startRotor(a,p){
    const slapBus=a.createGain(); slapBus.gain.value=1; slapBus.connect(a.destination);
    eng.slapBus=slapBus;
    let beat=0;
    const fire=()=>{
      if(!eng||!eng.slapBus) return;
      const t=a.currentTime, strong=(beat%2===0), amp=strong?0.6:0.32;
      // body of the whop: a fast down-sweeping low sine with a razor-sharp attack
      const o=a.createOscillator(); o.type="sine";
      o.frequency.setValueAtTime(strong?74:66,t);
      o.frequency.exponentialRampToValueAtTime(36,t+0.13);
      const g=a.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.linearRampToValueAtTime(amp,t+0.005);
      g.gain.exponentialRampToValueAtTime(0.0001,t+0.18);
      o.connect(g); g.connect(slapBus); o.start(t); o.stop(t+0.22);
      // slap transient: a brief filtered noise crack on the leading edge
      const nlen=(a.sampleRate*0.05)|0, nb=a.createBuffer(1,nlen,a.sampleRate), nd=nb.getChannelData(0);
      for(let i=0;i<nlen;i++) nd[i]=(Math.random()*2-1)*Math.pow(1-i/nlen,3);
      const ns=a.createBufferSource(); ns.buffer=nb;
      const nf=a.createBiquadFilter(); nf.type="bandpass"; nf.frequency.value=900; nf.Q.value=0.8;
      const ng=a.createGain(); ng.gain.value=amp*0.35;
      ns.connect(nf); nf.connect(ng); ng.connect(slapBus); ns.start(t);
      beat++;
    };
    eng.rotorTimer=setInterval(fire, 1000/(p.lfo*2));   // *2 → blade-pass rate, interleaved strong/weak
    fire();
  }
  function updateEngine(remain){
    if(!eng){ if(soundOn && rafId) startEngine(); if(!eng) return; }
    const a=ac(); if(!a) return; const now=a.currentTime; const p=eng.p;
    let e=0;
    if(remain<=DIVE_AT){ const t=Math.min(1,(DIVE_AT-remain)/DIVE_AT); e=t*t; }
    const f   = p.baseF*(1+p.diveF*e);
    const fc  = p.filt + p.diveFilt*e;
    const vol = p.vol + (p.volDive-p.vol)*e;
    const lfoRate = p.lfo + p.lfoDive*e;
    const windVol = p.wind + (p.windDive-p.wind)*e;
    const windFc  = p.windFc + p.windFcDive*e;
    eng.o1.frequency.setTargetAtTime(f,now,0.03);
    eng.o2.frequency.setTargetAtTime(f*p.detune,now,0.03);
    eng.filt.frequency.setTargetAtTime(fc,now,0.05);
    eng.out.gain.setTargetAtTime(vol,now,0.05);
    eng.lfo.frequency.setTargetAtTime(lfoRate,now,0.08);
    eng.wind.gain.setTargetAtTime(windVol,now,0.06);
    eng.wbp.frequency.setTargetAtTime(windFc,now,0.06);
    if(eng.whine){
      eng.whine.frequency.setTargetAtTime(p.whine.f*(1+(p.whine.fDive-1)*e),now,0.05);
      eng.whineGain.gain.setTargetAtTime(p.whine.vol+(p.whine.volDive-p.whine.vol)*e,now,0.06);
    }
  }
  function stopEngine(fade=0.1){
    stopHorn(Math.min(0.06,fade));
    if(!eng) return; const a=ac(); const e=eng; eng=null; if(!a) return;
    if(e.rotorTimer) clearInterval(e.rotorTimer);
    try{
      const now=a.currentTime, tc=Math.max(0.01,fade)/3, st=now+fade+0.06;
      e.out.gain.cancelScheduledValues(now); e.out.gain.setTargetAtTime(0.0001,now,tc);
      e.wind.gain.cancelScheduledValues(now); e.wind.gain.setTargetAtTime(0.0001,now,tc);
      e.o1.stop(st); e.o2.stop(st); e.lfo.stop(st); e.noise.stop(st);
      if(e.whine){ e.whineGain.gain.cancelScheduledValues(now); e.whineGain.gain.setTargetAtTime(0.0001,now,tc); e.whine.stop(st); }
      if(e.slapBus){ e.slapBus.gain.cancelScheduledValues(now); e.slapBus.gain.setTargetAtTime(0.0001,now,tc); }
    }catch(_){}
  }
  // Stall horn: harsh beating square tone, blares in the final seconds.
  let horn=null;
  function startHorn(){
    if(!soundOn||horn) return; const a=ac(); if(!a) return;
    const o1=a.createOscillator(), o2=a.createOscillator();
    o1.type="square"; o2.type="square";
    o1.frequency.value=880; o2.frequency.value=884;   // slight beat = harsher
    const g=a.createGain(); g.gain.value=0;
    o1.connect(g); o2.connect(g); g.connect(a.destination);
    o1.start(); o2.start();
    const t=a.currentTime; g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.075,t+0.04);
    horn={o1,o2,g};
  }
  function stopHorn(fade=0.05){
    if(!horn) return; const a=ac(); const h=horn; horn=null; if(!a) return;
    try{ const now=a.currentTime; h.g.gain.cancelScheduledValues(now);
      h.g.gain.setTargetAtTime(0.0001,now,Math.max(0.01,fade)/3);
      const st=now+fade+0.05; h.o1.stop(st); h.o2.stop(st);
    }catch(_){}
  }
  // Recovery whoosh: a downward wind-sweep — pulling out of the dive.
  function whoosh(){
    if(!soundOn) return; const a=ac(); if(!a) return; const now=a.currentTime;
    const len=0.6, nb=a.createBuffer(1,(a.sampleRate*len)|0,a.sampleRate);
    const d=nb.getChannelData(0); for(let i=0;i<d.length;i++){ const env=Math.sin(Math.PI*i/d.length); d[i]=(Math.random()*2-1)*env; }
    const src=a.createBufferSource(); src.buffer=nb;
    const bp=a.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=0.8;
    bp.frequency.setValueAtTime(2000,now); bp.frequency.exponentialRampToValueAtTime(320,now+0.55);
    const g=a.createGain();
    g.gain.setValueAtTime(0.0001,now); g.gain.linearRampToValueAtTime(0.15,now+0.08);
    g.gain.exponentialRampToValueAtTime(0.0001,now+0.6);
    src.connect(bp); bp.connect(g); g.connect(a.destination); src.start(now); src.stop(now+0.62);
  }
  function crash(){
    stopEngine(0.02);                           // engine cuts at impact
    if(!soundOn) return; const a=ac(); if(!a) return; const now=a.currentTime;
    // impact: filtered noise burst
    const len=1.2, buf=a.createBuffer(1, (a.sampleRate*len)|0, a.sampleRate);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++){ const env=Math.pow(1-i/d.length,1.7); d[i]=(Math.random()*2-1)*env; }
    const src=a.createBufferSource(); src.buffer=buf;
    const lp=a.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1400;
    const ng=a.createGain(); ng.gain.value=0.55;
    src.connect(lp); lp.connect(ng); ng.connect(a.destination); src.start(now);
    // low boom sweeping down
    const bo=a.createOscillator(), bg=a.createGain();
    bo.type="sine"; bo.frequency.setValueAtTime(150,now); bo.frequency.exponentialRampToValueAtTime(34,now+0.95);
    bg.gain.setValueAtTime(0.5,now); bg.gain.exponentialRampToValueAtTime(0.0001,now+1.05);
    bo.connect(bg); bg.connect(a.destination); bo.start(now); bo.stop(now+1.1);
  }
  sndBtn.addEventListener("click",()=>{
    soundOn=!soundOn; sndBtn.setAttribute("aria-pressed",String(soundOn));
    sndBtn.textContent=(soundOn?"♪ SOUND":"♪ MUTED");
    if(soundOn){ ac(); if(rafId) startEngine(); } else { stopEngine(0.05); }
  });

  function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]];} return a; }
  function setStrip(label,done,total){ stripLabel.textContent=label; stripCount.textContent=done+" / "+total; bar.style.width=(total?(done/total*100):0)+"%"; }

  // ---- Timer ----
  const TR=19, TCIRC=2*Math.PI*TR;
  let rafId=null, tStart=0, lastCeil=-1;
  function clearStress(){
    panel.classList.remove("shake","danger");
    caution.classList.remove("show","reduced");
  }
  function stopTimer(){ if(rafId){cancelAnimationFrame(rafId);rafId=null;} clearStress(); }
  function startTimer(){
    lastCeil=-1; tStart=performance.now();
    const ringEl=document.getElementById("tRing");
    const numEl=document.getElementById("tNum");
    if(!ringEl) return;
    startEngine();
    const loop=(now)=>{
      const remain=Math.max(0, QUESTION_TIME-(now-tStart)/1000);
      const frac=remain/QUESTION_TIME;
      ringEl.setAttribute("stroke-dashoffset", (TCIRC*(1-frac)).toFixed(2));
      const col = remain>8? "#41d3ff" : remain>5? "#ffb020" : "#ff5b6e";
      ringEl.setAttribute("stroke", col);
      numEl.style.color = col;
      const ceil=Math.ceil(remain); numEl.textContent=ceil;

      updateEngine(remain);
      if(remain<=3 && remain>0) startHorn();

      // stress escalation
      if(remain<=8 && remain>0){
        caution.classList.add("show"); if(reduceMotion) caution.classList.add("reduced");
      } else caution.classList.remove("show","reduced");
      if(remain<=5 && remain>0){ if(!reduceMotion) panel.classList.add("shake"); panel.classList.add("danger"); }
      else { panel.classList.remove("shake","danger"); }

      // pre-dive time-cue ticks (the dive engine covers the final 5s)
      if(ceil!==lastCeil && remain<=8 && remain>5){
        lastCeil=ceil; tone(560,0.05,"square",0.03);
      }

      if(remain<=0){ timeUp(); return; }
      rafId=requestAnimationFrame(loop);
    };
    rafId=requestAnimationFrame(loop);
  }

  // ---- Screens ----
  function renderStart(){
    stopTimer(); stopEngine(0);
    idx=0; answers=[]; times=[]; deck=[]; locked=false;
    tail.textContent="STANDBY";
    setStrip("PREFLIGHT",0,RUN_SIZE);
    drawStart();
  }
  function drawStart(){
    const p = poolFor(difficulty);
    const runN = Math.min(RUN_SIZE, p.length);
    const domains = new Set(p.map(q=>q.cat)).size;
    const sel = LEVELS.map(l=>`<button class="lvl ${l.key===difficulty.key?"on":""}" data-k="${l.key}">${l.name}</button>`).join("");
    body.innerHTML = `
      <div class="hero">
        <p class="kicker">Preflight Briefing</p>
        <h1>How high is your<br>aviation IQ?</h1>
        <p class="lede">Choose a rating, then fly ${runN} questions drawn at random from the ${p.length}-question ${difficulty.name} pool. Questions and answers reshuffle every run.</p>
        <div class="levelsel" role="group" aria-label="Difficulty">${sel}</div>
        <p class="lvlblurb">${difficulty.blurb}</p>
        <div class="warnnote">⏱ ${QUESTION_TIME}s per question. Cruise for the first 5s — then the engine and wind wind up into a dive, a stall horn blares in the final 3s, and zero means a crash (scored as missed). Answer in time for a recovery pull-out. Sound on for the full effect.</div>
        <div class="specs">
          <div><div class="n">${runN}</div><div class="l">Questions</div></div>
          <div><div class="n">${domains}</div><div class="l">Domains</div></div>
          <div><div class="n">${QUESTION_TIME}s</div><div class="l">Per Q</div></div>
        </div>
        <button class="btn" id="startBtn">Begin Taxi ▸</button>
      </div>`;
    body.querySelectorAll(".lvl").forEach(b=>b.addEventListener("click",()=>{
      difficulty = LEVELS.find(l=>l.key===b.dataset.k) || difficulty;
      drawStart();
    }));
    const sb=document.getElementById("startBtn");
    sb.addEventListener("click",()=>{ ac(); beginRun(); });
    sb.focus();
  }
  function beginRun(){
    const p = poolFor(difficulty);
    deck = shuffle(p).slice(0, Math.min(RUN_SIZE, p.length));
    idx=0; answers=[]; times=[]; locked=false;
    renderQuestion();
  }

  function renderQuestion(){
    locked=false;
    const item=deck[idx];
    item._order=shuffle(item.opts.map((_,i)=>i));
    pickEngine();
    tail.textContent="IN FLIGHT";
    setStrip("QUESTION",idx,deck.length);
    const optsHtml=item._order.map((orig,pos)=>`
      <button class="opt" data-orig="${orig}">
        <span class="key">${KEYS[pos]}</span>
        <span class="txt">${item.opts[orig]}</span>
      </button>`).join("");
    body.innerHTML = `
      <div class="qmeta">
        <span class="cat">${item.cat} <span class="eng">◉ ${curProfile.name}</span></span>
        <span class="mid">Q${String(idx+1).padStart(2,"0")} / ${String(deck.length).padStart(2,"0")}</span>
        <div class="timer" id="timer" aria-label="time remaining">
          <svg width="44" height="44" viewBox="0 0 44 44">
            <circle cx="22" cy="22" r="${TR}" fill="none" stroke="#0a1622" stroke-width="4"/>
            <circle id="tRing" cx="22" cy="22" r="${TR}" fill="none" stroke="#41d3ff" stroke-width="4"
              stroke-linecap="round" stroke-dasharray="${TCIRC.toFixed(2)}" stroke-dashoffset="0"/>
          </svg>
          <span class="tnum" id="tNum">${QUESTION_TIME}</span>
        </div>
      </div>
      <p class="question">${item.q}</p>
      <div class="options" id="options">${optsHtml}</div>
      <div id="afterbox"></div>
      <div class="actions hidden" id="actions">
        <button class="btn" id="nextBtn">${idx===deck.length-1?"See Results ▸":"Next ▸"}</button>
      </div>`;
    body.querySelectorAll(".opt").forEach(btn=>{
      btn.addEventListener("click",()=>choose(parseInt(btn.dataset.orig,10)));
    });
    startTimer();
  }

  function reveal(chosen){
    const item=deck[idx];
    answers[idx]=chosen; // may be null
    const optButtons=body.querySelectorAll(".opt");
    optButtons.forEach(btn=>{
      const orig=parseInt(btn.dataset.orig,10);
      btn.disabled=true;
      if(orig===item.correct) btn.classList.add("correct");
      else if(orig===chosen) btn.classList.add("wrong");
      else btn.classList.add("dim");
    });
    const good = chosen===item.correct;
    const timedOut = chosen===null;
    const after=document.getElementById("afterbox");
    const tag = good ? "✓ Correct" : timedOut ? "⏱ Time expired" : "✗ Not quite";
    after.innerHTML = `
      <div class="explain ${good?"ok":"no"}">
        <span class="tag">${tag}</span>
        ${item.why}
      </div>`;
    const actions=document.getElementById("actions");
    actions.classList.remove("hidden");
    const nextBtn=document.getElementById("nextBtn");
    nextBtn.addEventListener("click",advance);
    nextBtn.focus();
    setStrip("QUESTION",idx+1,deck.length);
  }

  function choose(origChoice){
    if(locked) return; locked=true;
    times[idx] = (performance.now()-tStart)/1000;
    stopTimer(); stopEngine(0.12);
    whoosh();  // pull out of the dive
    tone(origChoice===deck[idx].correct?760:300,0.09,"square",0.05);
    reveal(origChoice);
  }
  function timeUp(){
    if(locked) return; locked=true; times[idx]=QUESTION_TIME; stopTimer(); clearStress(); crash();
    reveal(null);
  }
  function advance(){
    if(idx<deck.length-1){ idx++; renderQuestion(); }
    else renderResult();
  }

  function renderResult(){
    stopTimer(); stopEngine(0.15);
    const total=deck.length;
    let score=0, timeouts=0;
    const cats={};
    deck.forEach((item,i)=>{
      const good=answers[i]===item.correct;
      if(good) score++;
      if(answers[i]===null||answers[i]===undefined) timeouts++;
      const c=cats[item.cat]||(cats[item.cat]={right:0,total:0});
      c.total++; if(good) c.right++;
    });
    const frac=score/total, pct=Math.round(frac*100);
    let rank=RANKS[0]; for(const r of RANKS){ if(frac>=r.min) rank=r; }
    tail.textContent="LANDED";
    setStrip("DEBRIEF",total,total);

    const R=80,CIRC=2*Math.PI*R,dash=frac*CIRC;
    const col=frac>=0.78?"var(--green)":frac>=0.5?"var(--cyan)":"var(--amber)";
    const chips=Object.keys(cats).sort().map(c=>{
      const {right,total}=cats[c];
      const cls=right===total?"hi":right===0?"lo":"";
      return `<span class="chip ${cls}">${c} <b>${right}/${total}</b></span>`;
    }).join("");
    const rows=deck.map((item,i)=>{
      const good=answers[i]===item.correct;
      const to=answers[i]===null||answers[i]===undefined;
      return `<div class="br-row">
        <span class="mark ${good?"y":"n"}">${good?"✓":(to?"⏱":"✗")}</span>
        <span class="q">Q${i+1}. ${item.q}
          ${good?"":`<span class="a">Correct: ${item.opts[item.correct]}</span>`}
        </span></div>`;
    }).join("");

    body.innerHTML = `
      <div class="hero">
        <p class="kicker">Post-Flight Debrief · ${difficulty.name}</p>
        <div class="gauge">
          <svg width="190" height="190" viewBox="0 0 190 190">
            <circle cx="95" cy="95" r="${R}" fill="none" stroke="#0a1622" stroke-width="12"/>
            <circle cx="95" cy="95" r="${R}" fill="none" stroke="${col}" stroke-width="12"
              stroke-linecap="round" stroke-dasharray="${dash} ${CIRC}"
              style="filter:drop-shadow(0 0 8px ${col});transition:stroke-dasharray .9s cubic-bezier(.4,0,.2,1)"/>
          </svg>
          <div class="val"><span class="pct" style="color:${col}">${pct}%</span><span class="of">${score} / ${total} correct</span></div>
        </div>
        <div class="rank"><span class="rankwing">✈</span> ${rank.name}</div>
        <p class="rankdesc">${rank.desc}</p>
        ${timeouts>0?`<p class="tmonote">Ran out of time on <b>${timeouts}</b> question${timeouts>1?"s":""} — decision speed counts too.</p>`:``}
      </div>
      <div class="catscores">${chips}</div>
      <div class="breakdown">${rows}</div>
      <div class="endbtns">
        ${flaggedList().length?`<button class="btn ghost" id="reviewBtn">Review ${flaggedList().length} ▸</button>`:`<span class="cleanmark">✓ Clean sweep — nothing to review</span>`}
        <button class="btn" id="againBtn">Fly It Again ▸</button>
      </div>`;
    const rv=document.getElementById("reviewBtn");
    if(rv) rv.addEventListener("click", renderReview);
    document.getElementById("againBtn").addEventListener("click",renderStart);
    (rv||document.getElementById("againBtn")).focus();
    requestAnimationFrame(()=>{
      const c=body.querySelector("circle:last-of-type");
      if(c){ c.setAttribute("stroke-dasharray","0 "+CIRC); requestAnimationFrame(()=>c.setAttribute("stroke-dasharray",dash+" "+CIRC)); }
    });
  }

  // Questions missed, timed out on, or answered slower than the threshold.
  function flaggedList(){
    return deck.map((item,i)=>({item,i})).filter(({item,i})=>{
      const good = answers[i]===item.correct;
      const slow = (times[i]!=null) && times[i] > SLOW_THRESHOLD;
      return !good || slow;
    });
  }

  let reviewList = [], reviewPos = 0;
  function renderReview(){
    stopTimer(); stopEngine(0);
    reviewList = flaggedList();
    reviewPos = 0;
    drawReview();
  }
  function drawReview(){
    const list = reviewList;
    if(!list.length){ renderResult(); return; }
    reviewPos = Math.max(0, Math.min(reviewPos, list.length-1));
    const { item, i } = list[reviewPos];
    const last = reviewPos === list.length-1;
    tail.textContent="REVIEW";
    setStrip("REVIEW", reviewPos+1, list.length);
    const chosen = answers[i];
    const good = chosen===item.correct;
    const to = chosen==null;
    const t = times[i];
    const reason = to ? "TIMED OUT" : (!good ? "MISSED" : `SLOW · ${t.toFixed(1)}s`);
    const badge = (to||!good) ? "bad" : "slow";
    const ref = refFor(item.cat);
    const opts = item.opts.map((o,oi)=>{
      let cls="rv-opt";
      if(oi===item.correct) cls+=" correct";
      else if(oi===chosen && !good) cls+=" wrong";
      return `<div class="${cls}"><span class="rv-key">${KEYS[oi]}</span><span>${o}</span></div>`;
    }).join("");
    body.innerHTML = `
      <div class="rvhead">
        <p class="kicker">Debrief · Review ${reviewPos+1} / ${list.length}</p>
        <p class="lvlblurb">Missed, timed out, or slower than ${SLOW_THRESHOLD}s — study the answer, then continue.</p>
      </div>
      <div class="rvcard">
        <div class="rvmeta"><span class="cat">${item.cat}</span><span class="rvtag ${badge}">${reason}</span></div>
        <div class="rvq">${item.q}</div>
        <div class="rvopts">${opts}</div>
        <div class="explain ok"><span class="tag">Why</span>${item.why}</div>
        <div class="rvstudy">
          <span class="tag">Study further</span>
          ${ref.label} · <a href="${ref.url}" target="_blank" rel="noopener noreferrer">FAA library ↗</a>
        </div>
      </div>
      <div class="endbtns">
        <button class="btn ghost" id="rvBack">◂ Debrief</button>
        ${reviewPos>0?`<button class="btn ghost" id="rvPrev">Prev</button>`:``}
        <button class="btn" id="nextBtn">${last?"Finish ▸":"Next ▸"}</button>
      </div>`;
    document.getElementById("rvBack").addEventListener("click", renderResult);
    const pv=document.getElementById("rvPrev");
    if(pv) pv.addEventListener("click", ()=>{ reviewPos--; drawReview(); });
    document.getElementById("nextBtn").addEventListener("click", ()=>{
      if(last){ renderResult(); } else { reviewPos++; drawReview(); }
    });
    document.getElementById("nextBtn").focus();
  }

  window.addEventListener("keydown",(e)=>{
    const opts=body.querySelectorAll(".opt");
    if(opts.length && !locked){
      let pos=-1;
      if(e.key>="1"&&e.key<="4") pos=+e.key-1;
      const up=e.key.toUpperCase();
      if(["A","B","C","D"].includes(up)) pos=["A","B","C","D"].indexOf(up);
      if(pos>=0&&pos<opts.length){ e.preventDefault(); opts[pos].click(); return; }
    }
    if(e.key==="Enter"||e.key==="ArrowRight"){
      const next=document.getElementById("nextBtn");
      if(next){ e.preventDefault(); next.click(); }
    }
    if(e.key==="ArrowLeft"){
      const prev=document.getElementById("rvPrev");
      if(prev){ e.preventDefault(); prev.click(); }
    }
  });

  renderStart();
})();
</script>
