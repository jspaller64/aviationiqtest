<title>Aviation IQ Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#070c12;
    --panel:#0d1620;
    --panel-2:#101e2a;
    --edge:#1d3242;
    --edge-soft:#152634;
    --ink:#dfeaf2;
    --ink-dim:#7f95a6;
    --cyan:#41d3ff;
    --green:#3ee08f;
    --amber:#ffb020;
    --red:#ff5b6e;
    --disp:"Chakra Petch", "Bahnschrift", sans-serif;
    --body:"IBM Plex Sans", system-ui, sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #12212e 0%, rgba(18,33,46,0) 60%),
      var(--bg);
    color:var(--ink);
    font-family:var(--body);
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    line-height:1.5;
  }
  .frame{ width:100%; max-width:640px; }

  .topline{
    display:flex; align-items:center; justify-content:space-between;
    gap:12px; margin-bottom:14px;
  }
  .brand{
    font-family:var(--disp); font-weight:700; letter-spacing:.14em;
    text-transform:uppercase; font-size:clamp(15px,3.4vw,20px); color:var(--ink);
  }
  .brand b{color:var(--cyan);}
  .topright{display:flex;align-items:center;gap:12px;}
  .tail{
    font-family:var(--mono); font-size:11px; color:var(--ink-dim);
    letter-spacing:.12em; white-space:nowrap;
  }
  .sndbtn{
    font-family:var(--mono); font-size:10px; letter-spacing:.08em;
    color:var(--ink-dim); background:transparent; border:1px solid var(--edge);
    border-radius:6px; padding:6px 9px; cursor:pointer;
  }
  .sndbtn:hover{border-color:var(--cyan);color:var(--ink);}
  .sndbtn[aria-pressed="true"]{color:var(--cyan);border-color:#2a4a5c;}
  .sndbtn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}

  .panel{
    position:relative;
    background:linear-gradient(180deg,var(--panel-2),var(--panel));
    border:1px solid var(--edge); border-radius:16px;
    box-shadow:0 18px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(120,180,220,.06);
    overflow:hidden;
  }
  .panel.shake{ animation:shake .32s infinite; }
  @keyframes shake{
    0%,100%{transform:translate(0,0);}
    20%{transform:translate(-2px,1px);}
    40%{transform:translate(2px,-1px);}
    60%{transform:translate(-2px,-1px);}
    80%{transform:translate(2px,1px);}
  }
  .vignette{
    position:absolute; inset:0; pointer-events:none; z-index:6;
    box-shadow:inset 0 0 80px 12px rgba(255,50,70,.0);
    opacity:0; transition:opacity .25s, box-shadow .25s;
  }
  .panel.danger .vignette{ opacity:1; box-shadow:inset 0 0 90px 16px rgba(255,50,70,.55); }
  .caution{
    position:absolute; top:56px; left:50%; transform:translateX(-50%);
    z-index:8; display:none;
    font-family:var(--disp); font-weight:700; letter-spacing:.14em;
    font-size:12px; text-transform:uppercase; color:#1a0f00;
    background:var(--amber); border:1px solid #ffd27a;
    padding:6px 14px; border-radius:6px;
    box-shadow:0 4px 14px rgba(255,176,32,.5);
  }
  .caution.show{ display:block; animation:cflash .6s steps(1) infinite; }
  .caution.reduced{ animation:none; opacity:1; }
  @keyframes cflash{ 0%,49%{opacity:1;} 50%,100%{opacity:.15;} }

  .strip{
    display:flex; align-items:center; gap:12px;
    padding:12px 16px; border-bottom:1px solid var(--edge-soft);
    background:rgba(6,12,18,.5); font-family:var(--mono); font-size:11px;
    color:var(--ink-dim); letter-spacing:.08em;
  }
  .track{
    position:relative; flex:1; height:6px; border-radius:999px;
    background:#0a1520; border:1px solid var(--edge-soft); overflow:hidden;
  }
  .track > i{
    position:absolute; left:0; top:0; bottom:0; width:0%;
    background:linear-gradient(90deg,#1e6a8c,var(--cyan));
    box-shadow:0 0 12px rgba(65,211,255,.6);
    transition:width .4s cubic-bezier(.4,0,.2,1);
  }
  .readout{color:var(--cyan);font-weight:600;}

  .body{padding:26px 22px 24px; position:relative; z-index:2;}

  .hero{text-align:center;padding:14px 6px 4px;}
  .hero h1{
    font-family:var(--disp); font-weight:700; font-size:clamp(26px,6.6vw,40px);
    letter-spacing:.02em; margin:0 0 6px; text-wrap:balance;
    background:linear-gradient(180deg,#eaf6ff,#8fd4ef);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .kicker{
    font-family:var(--mono); text-transform:uppercase; letter-spacing:.22em;
    font-size:11px; color:var(--amber); margin:0 0 18px;
  }
  .lede{color:var(--ink-dim);max-width:46ch;margin:0 auto 20px;font-size:15px;}
  .levelsel{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:0 auto 8px;}
  .lvl{
    font-family:var(--disp);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12px;
    color:var(--ink-dim);background:var(--panel-2);border:1px solid var(--edge);border-radius:8px;
    padding:10px 18px;cursor:pointer;transition:color .15s,background .15s,border-color .15s,box-shadow .15s;
  }
  .lvl:hover{border-color:var(--cyan);color:var(--ink);}
  .lvl.on{color:#04140b;background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 14px rgba(65,211,255,.4);}
  .lvl:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
  .lvlblurb{font-size:12px;color:var(--ink-dim);margin:0 auto 20px;max-width:42ch;min-height:1.1em;}
  .warnnote{
    font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--red);
    border:1px solid rgba(255,91,110,.35);border-radius:8px;
    padding:9px 12px;max-width:44ch;margin:0 auto 22px;
  }
  .specs{
    display:flex; justify-content:center; gap:0;
    border:1px solid var(--edge-soft); border-radius:10px; overflow:hidden;
    margin:0 auto 24px; max-width:400px;
  }
  .specs div{flex:1;padding:12px 8px;text-align:center;}
  .specs div + div{border-left:1px solid var(--edge-soft);}
  .specs .n{font-family:var(--mono);font-size:20px;color:var(--cyan);font-weight:600;}
  .specs .l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-top:4px;}

  .qmeta{
    display:flex; justify-content:space-between; align-items:center;
    font-family:var(--mono); font-size:11px; letter-spacing:.1em;
    color:var(--ink-dim); text-transform:uppercase; margin-bottom:14px; gap:10px;
  }
  .qmeta .cat{color:var(--amber);}
  .qmeta .eng{color:var(--ink-dim);font-weight:400;letter-spacing:.06em;}
  .qmeta .mid{flex:1;text-align:center;}
  .timer{ position:relative; width:44px; height:44px; flex:none; }
  .timer svg{ transform:rotate(-90deg); display:block; }
  .timer .tnum{
    position:absolute; inset:0; display:grid; place-items:center;
    font-family:var(--mono); font-size:14px; font-weight:600; color:var(--cyan);
  }

  .question{
    font-family:var(--disp); font-weight:600; font-size:clamp(19px,4.4vw,24px);
    line-height:1.32; margin:0 0 22px; text-wrap:balance;
  }
  .options{display:flex;flex-direction:column;gap:11px;}
  .opt{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    background:var(--panel-2); border:1px solid var(--edge); border-radius:11px;
    padding:14px 16px; color:var(--ink); font-family:var(--body); font-size:15px;
    cursor:pointer; transition:border-color .15s, background .15s, transform .05s;
  }
  .opt:hover:not(:disabled){border-color:var(--cyan);background:#12222f;}
  .opt:active:not(:disabled){transform:translateY(1px);}
  .opt:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
  .opt .key{
    flex:none; width:26px;height:26px;border-radius:6px; display:grid;place-items:center;
    font-family:var(--mono);font-size:12px;font-weight:600;
    background:#0a1520;border:1px solid var(--edge);color:var(--ink-dim);
  }
  .opt.correct{border-color:var(--green);background:rgba(62,224,143,.12);}
  .opt.correct .key{background:var(--green);color:#04140b;border-color:var(--green);}
  .opt.wrong{border-color:var(--red);background:rgba(255,91,110,.12);}
  .opt.wrong .key{background:var(--red);color:#1a0508;border-color:var(--red);}
  .opt:disabled{cursor:default;}
  .opt.dim{opacity:.5;}

  .explain{
    margin-top:16px; border-left:3px solid var(--cyan);
    background:rgba(65,211,255,.06); padding:12px 14px;
    border-radius:0 8px 8px 0; font-size:14px; color:var(--ink);
  }
  .explain.ok{border-left-color:var(--green);background:rgba(62,224,143,.07);}
  .explain.no{border-left-color:var(--red);background:rgba(255,91,110,.07);}
  .explain .tag{
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    display:block;margin-bottom:4px;
  }
  .explain.ok .tag{color:var(--green);}
  .explain.no .tag{color:var(--red);}

  .actions{display:flex;justify-content:flex-end;margin-top:20px;}
  .btn{
    font-family:var(--disp);font-weight:600;letter-spacing:.06em;
    text-transform:uppercase;font-size:14px;
    background:linear-gradient(180deg,#1f8fbf,#136a92);
    color:#eafaff;border:1px solid #3aa9d6;
    padding:13px 26px;border-radius:10px;cursor:pointer;
    box-shadow:0 6px 18px rgba(19,106,146,.4);
    transition:filter .15s, transform .05s;
  }
  .btn:hover{filter:brightness(1.12);}
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;}

  .gauge{ position:relative;width:190px;height:190px;margin:6px auto 18px; }
  .gauge svg{transform:rotate(-90deg);}
  .gauge .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .gauge .pct{font-family:var(--mono);font-size:40px;font-weight:600;color:var(--cyan);}
  .gauge .of{font-family:var(--mono);font-size:12px;color:var(--ink-dim);letter-spacing:.1em;}
  .rank{font-family:var(--disp);font-weight:700;font-size:clamp(22px,5vw,30px);letter-spacing:.02em;margin:2px 0 6px;text-wrap:balance;}
  .rankwing{color:var(--amber);}
  .rankdesc{color:var(--ink-dim);max-width:44ch;margin:0 auto 20px;font-size:15px;}
  .tmonote{font-family:var(--mono);font-size:11px;color:var(--ink-dim);margin:0 0 20px;letter-spacing:.05em;}
  .tmonote b{color:var(--red);}
  .catscores{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 22px;}
  .chip{font-family:var(--mono);font-size:11px;letter-spacing:.04em;border:1px solid var(--edge);border-radius:999px;padding:6px 11px;color:var(--ink-dim);}
  .chip b{color:var(--ink);font-weight:600;}
  .chip.hi{border-color:var(--green);color:var(--green);}
  .chip.lo{border-color:var(--red);color:var(--red);}
  .breakdown{text-align:left;border:1px solid var(--edge-soft);border-radius:10px;margin:0 0 22px;max-height:230px;overflow:auto;}
  .br-row{display:flex;gap:12px;padding:11px 14px;font-size:13px;align-items:flex-start;}
  .br-row + .br-row{border-top:1px solid var(--edge-soft);}
  .br-row .mark{font-family:var(--mono);flex:none;font-weight:600;}
  .br-row .mark.y{color:var(--green);}
  .br-row .mark.n{color:var(--red);}
  .br-row .q{color:var(--ink);}
  .br-row .a{color:var(--ink-dim);display:block;margin-top:2px;font-size:12px;}
  .center{text-align:center;}
  .endbtns{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;}
  .cleanmark{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--green);}
  .rvhead{text-align:center;padding:10px 6px 4px;}
  .rvtitle{font-family:var(--disp);font-weight:700;font-size:clamp(20px,5vw,26px);margin:2px 0 6px;color:var(--ink);}
  .reviewlist{display:flex;flex-direction:column;gap:14px;margin:8px 0 22px;text-align:left;}
  .rvcard{border:1px solid var(--edge);border-radius:12px;padding:14px 16px;background:var(--panel-2);}
  .rvmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:9px;
    font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;}
  .rvmeta .cat{color:var(--amber);}
  .rvtag{padding:3px 9px;border-radius:999px;border:1px solid;white-space:nowrap;}
  .rvtag.bad{color:var(--red);border-color:var(--red);}
  .rvtag.slow{color:var(--amber);border-color:var(--amber);}
  .rvq{font-family:var(--disp);font-weight:600;font-size:16px;line-height:1.35;margin-bottom:11px;text-wrap:balance;}
  .rvopts{display:flex;flex-direction:column;gap:6px;margin-bottom:11px;}
  .rv-opt{display:flex;gap:11px;align-items:flex-start;font-size:14px;color:var(--ink-dim);
    padding:8px 11px;border:1px solid var(--edge-soft);border-radius:8px;}
  .rv-opt .rv-key{flex:none;font-family:var(--mono);font-size:11px;color:var(--ink-dim);margin-top:1px;}
  .rv-opt.correct{color:var(--green);border-color:var(--green);background:rgba(62,224,143,.08);}
  .rv-opt.correct .rv-key{color:var(--green);}
  .rv-opt.wrong{color:var(--red);border-color:var(--red);background:rgba(255,91,110,.08);}
  .rv-opt.wrong .rv-key{color:var(--red);}
  .rvstudy{margin-top:12px;padding-top:11px;border-top:1px dashed var(--edge);font-size:13px;color:var(--ink-dim);line-height:1.5;}
  .rvstudy .tag{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--amber);display:block;margin-bottom:4px;}
  .rvstudy a{color:var(--cyan);text-decoration:none;border-bottom:1px solid rgba(65,211,255,.4);white-space:nowrap;}
  .rvstudy a:hover{border-bottom-color:var(--cyan);}
  .rvstudy a:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;}
  .foot{text-align:center;font-family:var(--mono);font-size:10px;color:var(--ink-dim);letter-spacing:.12em;margin-top:14px;}
  .hidden{display:none !important;}
  @media (prefers-reduced-motion: reduce){
    .track > i{transition:none;}
    .panel.shake{animation:none;}
  }
</style>

<div class="frame">
  <div class="topline">
    <div class="brand">AVIATION <b>IQ</b> CHECK</div>
    <div class="topright">
      <button class="sndbtn" id="sndBtn" aria-pressed="true" title="Toggle warning sounds">♪ SOUND</button>
      <div class="tail" id="tail">STANDBY</div>
    </div>
  </div>

  <div class="panel" id="panel">
    <div class="vignette"></div>
    <div class="caution" id="caution">⚠ MASTER CAUTION</div>
    <div class="strip" id="strip">
      <span id="stripLabel">PREFLIGHT</span>
      <div class="track"><i id="bar"></i></div>
      <span class="readout" id="stripCount">0 / 0</span>
    </div>
    <div class="body" id="body"><!-- screens injected here --></div>
  </div>

  <div class="foot">NO AUTHORITY FOR REAL-WORLD FLIGHT · FOR FUN &amp; LEARNING ONLY</div>
</div>

<script>
(() => {
  "use strict";

  const QUESTION_TIME = 15;   // seconds per question
  const RUN_SIZE = 40;        // questions drawn per run from the pool
  const SLOW_THRESHOLD = 8;   // seconds; slower answers are flagged for review

  const QUESTIONS = [
    { cat:"Aerodynamics", q:"A given wing always stalls at the same…",
      opts:["Indicated airspeed","Critical angle of attack","Pitch attitude","Bank angle"], correct:1,
      why:"A stall is defined by exceeding the critical angle of attack — not by any airspeed. That's why an aircraft can stall at high speed in a steep pull-up or while pointed downhill." },
    { cat:"Aerodynamics", q:"In a level, coordinated 60° bank turn, the load factor is approximately…",
      opts:["1.5 G","2 G","3 G","4 G"], correct:1,
      why:"Load factor in a level turn is 1/cos(bank); cos 60° = 0.5, so n ≈ 2 G. Stall speed rises by √2 (≈41%) at that load." },
    { cat:"Performance", q:"During takeoff, what does V1 mean?",
      opts:["The speed at which the wheels leave the ground","Best rate-of-climb speed after liftoff","Takeoff decision speed — beyond it you're committed to fly","The airframe's never-exceed speed"], correct:2,
      why:"V1 is decision speed: before it you can reject and stop on the remaining runway; at or after it you continue the takeoff even with an engine failure. Rotation speed is VR." },
    { cat:"Performance", q:"Vx and Vy differ in that Vx gives you…",
      opts:["The most altitude gained per unit of time","The most altitude gained per unit of horizontal distance","The lowest fuel burn in cruise","The highest true airspeed in a climb"], correct:1,
      why:"Vx (best angle of climb) maximizes height gained over ground distance — used to clear obstacles. Vy (best rate) maximizes height gained per minute. Vx is slower than Vy at low altitude." },
    { cat:"Performance", q:"Flying on the “back side of the power curve” (region of reversed command) means…",
      opts:["You need less power to fly slower","You need more power to fly slower","Thrust no longer affects airspeed","The aircraft cannot be trimmed"], correct:1,
      why:"Below the speed for minimum drag (roughly L/Dmax), induced drag dominates, so flying slower actually requires MORE power. This regime bites on short-field and slow approaches." },
    { cat:"High-Altitude", q:"At very high altitude the gap between low-speed stall and high-speed Mach buffet shrinks to almost nothing. This regime is nicknamed…",
      opts:["The service ceiling","Coffin corner","Ground effect","The transition layer"], correct:1,
      why:"“Coffin corner” — the aerodynamic ceiling where stall speed and critical Mach nearly meet, leaving a razor-thin speed band. Slow down and you stall; speed up and you hit Mach buffet." },
    { cat:"High-Altitude", q:"As a swept-wing jet approaches its critical Mach number, shockwaves can shift the center of pressure aft, producing…",
      opts:["An uncommanded nose-up pitch","An uncommanded nose-down pitch (Mach tuck)","A sudden roll to the left","A loss of all elevator authority only"], correct:1,
      why:"Mach tuck: the aft movement of the center of pressure pitches the nose down, which can accelerate the aircraft further into the problem. Mach trim systems counter it." },
    { cat:"High-Altitude", q:"Climbing at a constant indicated airspeed, your true airspeed…",
      opts:["Increases","Decreases","Stays exactly the same","Falls to zero at the tropopause"], correct:0,
      why:"Thinner air means fewer molecules strike the pitot system, so a given IAS corresponds to a higher TAS as you climb — roughly +2% per 1,000 ft as a rule of thumb." },
    { cat:"Control", q:"Which of these is a genuine left-turning tendency in a single-engine propeller aircraft?",
      opts:["Adverse yaw","P-factor","Dutch roll","Mach tuck"], correct:1,
      why:"The four left-turning tendencies are torque, P-factor, spiraling slipstream, and gyroscopic precession. Adverse yaw is a roll-related effect, not one of them." },
    { cat:"Control", q:"Loading an aircraft with its center of gravity too far AFT tends to make it…",
      opts:["More longitudinally stable and nose-heavy","Less longitudinally stable, with degraded stall/spin recovery","Impossible to rotate on takeoff","Unaffected — CG only changes range"], correct:1,
      why:"An aft CG shortens the moment arm to the tail, reducing longitudinal stability and making stall and spin recovery harder — sometimes impossible past the aft limit." },
    { cat:"Instruments", q:"If the STATIC port becomes blocked during a climb (pitot clear), the altimeter will…",
      opts:["Read progressively too high","Read progressively too low","Freeze at the altitude where the blockage occurred","Immediately drop to zero"], correct:2,
      why:"With no fresh static pressure reaching it, the altimeter is trapped and freezes at the blockage altitude. The airspeed indicator and VSI also misbehave until the alternate static source is used." },
    { cat:"Instruments", q:"Traditional attitude, heading, and turn indicators work because a spinning gyro exhibits…",
      opts:["Magnetic dip","Rigidity in space","Barometric hysteresis","Coriolis drift"], correct:1,
      why:"Rigidity in space keeps a spinning gyro's axis fixed relative to space, giving a stable reference; precession is the second gyroscopic property these instruments exploit." },
    { cat:"Navigation", q:"A VOR ground station provides an aircraft with…",
      opts:["Slant-range distance to the station","Magnetic bearing information via 360 radials","A precision glidepath to the runway","Real-time winds aloft"], correct:1,
      why:"A VOR defines magnetic radials to/from the station for course guidance. Distance is provided separately by co-located DME; glidepath is an ILS function." },
    { cat:"Navigation", q:"On an ILS approach, the localizer provides ______ and the glideslope provides ______.",
      opts:["Vertical guidance / lateral guidance","Lateral (centerline) guidance / vertical guidance","Distance / heading","Wind / temperature"], correct:1,
      why:"Localizer = lateral guidance to the runway centerline; glideslope = vertical guidance down the descent path. Together they form the precision ILS." },
    { cat:"Navigation", q:"A great-circle route between two points is…",
      opts:["A line of constant compass heading","The shortest distance across the surface of the globe","Always due east or due west","The route that avoids all controlled airspace"], correct:1,
      why:"A great circle is the shortest path over a sphere. A rhumb line (constant heading) is longer but simpler to fly, which historically mattered before modern nav systems." },
    { cat:"Airspace / Regs", q:"In the U.S., Class B airspace is established around…",
      opts:["Small untowered rural airports","The nation's busiest airports, shaped like an inverted wedding cake","Military operations areas only","Oceanic route structures"], correct:1,
      why:"Class B surrounds the busiest hubs and is drawn as an upside-down tiered “wedding cake.” An explicit ATC clearance is required to enter." },
    { cat:"Airspace / Regs", q:"For VFR in Class E below 10,000 ft MSL, the basic requirement is 3 SM visibility and cloud clearance of…",
      opts:["Clear of clouds","500 ft below, 1,000 ft above, 2,000 ft horizontal","1,000 ft below, 1,000 ft above, 1 SM horizontal","No cloud clearance is required"], correct:1,
      why:"The classic “3-152”: 3 statute miles visibility, 500 below, 1,000 above, 2,000 feet horizontal from clouds. Class B, by contrast, is just “clear of clouds.”" },
    { cat:"Airspace / Regs", q:"Two aircraft at the same altitude are converging (not head-on). Right of way belongs to the aircraft…",
      opts:["On the other's left","On the other's right","At the higher airspeed","That is heavier"], correct:1,
      why:"Like boats, the aircraft on the right has right of way; the other gives way. (Different-category rules and head-on/overtaking cases have their own provisions.)" },
    { cat:"Airspace / Regs", q:"For VFR flight during the day, U.S. rules require enough fuel to reach the destination plus a reserve of at least…",
      opts:["10 minutes","30 minutes at normal cruise","45 minutes at normal cruise","No specific reserve"], correct:1,
      why:"Day VFR reserve is 30 minutes at normal cruise; night VFR and IFR require 45 minutes. These are legal minimums, not good operating practice." },
    { cat:"Weather", q:"A METAR reporting “BKN025” means…",
      opts:["Broken clouds at 250 ft AGL","Broken clouds at 2,500 ft AGL","Broken clouds at 25,000 ft","Visibility of 2.5 statute miles"], correct:1,
      why:"Cloud heights in a METAR are in hundreds of feet AGL, so 025 = 2,500 ft. A BKN or OVC layer constitutes a ceiling." },
    { cat:"Weather", q:"Fog or low stratus becomes increasingly likely as the temperature/dewpoint spread…",
      opts:["Grows larger","Narrows toward zero","Reverses (dewpoint above temperature)","Has no bearing on cloud"], correct:1,
      why:"As temperature cools toward the dewpoint (spread → 0), the air reaches saturation and moisture condenses into fog or cloud." },
    { cat:"Weather", q:"Hazardous structural icing is generally most likely in visible moisture at temperatures of about…",
      opts:["+5°C to +15°C","0°C to roughly −20°C","−40°C and colder","Only while on the ground"], correct:1,
      why:"Supercooled liquid droplets — which freeze on contact with the airframe — are most common from around freezing down to about −20°C. Far colder, moisture is mostly ice crystals that don't adhere as readily." },
    { cat:"Weather", q:"The standard (ISA) sea-level values are 15°C and 29.92 inHg, with pressure decreasing roughly…",
      opts:["1 inHg per 1,000 ft","1 inHg per 500 ft","1 inHg per 5,000 ft","0.1 inHg per 1,000 ft"], correct:0,
      why:"About 1 inch of mercury per 1,000 ft near sea level — the basis for the altimeter and for the “1 inch = 1,000 ft” setting rule of thumb." },
    { cat:"Systems", q:"In a modern high-bypass turbofan, most of the thrust is produced by…",
      opts:["The hot exhaust jet from the core","The large front fan moving bypass air","Compressor bleed air","An afterburner"], correct:1,
      why:"High-bypass engines get the bulk of their thrust from the fan accelerating a large mass of bypass air — quieter and far more efficient than a pure turbojet's high-velocity exhaust." },
    { cat:"Systems", q:"A transponder operating in Mode C additionally reports the aircraft's…",
      opts:["Ground track","Pressure altitude","True airspeed","Fuel state"], correct:1,
      why:"Mode C adds pressure-altitude reporting to the beacon code, letting ATC see altitude on radar. Mode S adds a unique address and datalink capability." },
    { cat:"Human Factors", q:"The hypoxia a healthy pilot suffers from simply climbing too high without oxygen is…",
      opts:["Hypemic hypoxia","Hypoxic hypoxia","Stagnant hypoxia","Histotoxic hypoxia"], correct:1,
      why:"Hypoxic (altitude) hypoxia comes from the reduced partial pressure of oxygen at altitude. Hypemic is reduced carrying capacity (e.g. CO); stagnant is poor circulation; histotoxic is cells that can't use O2." },
    { cat:"Human Factors", q:"“The leans” — a stubborn false sensation of banking — originates in the…",
      opts:["Eyes adjusting to darkness","Vestibular system of the inner ear","Onset of carbon-monoxide poisoning","Middle-ear pressure during descent"], correct:1,
      why:"A roll entered too slowly to trigger the inner ear, followed by a sensed roll-out, leaves the vestibular system convinced you're still banked. Trust the attitude indicator over the seat of the pants." },
    { cat:"Operations", q:"The strongest, most hazardous wingtip vortices are shed by an aircraft that is…",
      opts:["Light, fast, and dirty (gear/flaps out)","Heavy, clean, and slow","Small and fast","Stationary on the ramp"], correct:1,
      why:"Wake strength rises with weight and angle of attack and falls with span efficiency, so “heavy, clean, slow” (e.g. a big jet on approach/departure) makes the worst vortices. Hence spacing behind heavies." },
    { cat:"Emergencies", q:"A pilot sets transponder code 7600. This signals…",
      opts:["A general emergency","Lost radio communications","Unlawful interference (hijack)","A minimum-fuel state"], correct:1,
      why:"7500 = hijack, 7600 = radio (communications) failure, 7700 = general emergency. Each triggers a distinct ATC alert." },

    /* ---- Risk management & judgment (ADM) ---- */
    { cat:"Risk Management", q:"A pilot thinks, “These rules are too restrictive — I know better.” This is the hazardous attitude of…",
      opts:["Invulnerability","Anti-authority","Resignation","Impulsivity"], correct:1,
      why:"Anti-authority. Its antidote is the phrase “Follow the rules — they are usually right.” The five hazardous attitudes are anti-authority, impulsivity, invulnerability, macho, and resignation." },
    { cat:"Risk Management", q:"The recognized antidote to the “Invulnerability” attitude (“It won't happen to me”) is…",
      opts:["“Not so fast — think first.”","“It could happen to me.”","“I'm not helpless.”","“Taking chances is foolish.”"], correct:1,
      why:"“It could happen to me” counters the false belief that accidents only happen to others. (Anti-authority → follow the rules; impulsivity → not so fast; macho → taking chances is foolish; resignation → I'm not helpless.)" },
    { cat:"Risk Management", q:"The IMSAFE checklist is used before a flight to evaluate…",
      opts:["The aircraft's airworthiness","The pilot's own fitness to fly","The destination weather","The fuel and performance plan"], correct:1,
      why:"IMSAFE — Illness, Medication, Stress, Alcohol, Fatigue, Emotion — is a self-assessment of the pilot. It's about you, not the machine." },
    { cat:"Risk Management", q:"The PAVE risk-assessment model groups hazards into Pilot, Aircraft, enVironment, and…",
      opts:["Altitude","External pressures","Visibility","Airspace"], correct:1,
      why:"PAVE: Pilot, Aircraft, enVironment, External pressures. Naming the “External pressures” (schedules, passengers, bosses) makes that hidden risk visible so you can manage it." },
    { cat:"Decision Making", q:"You're a VFR-only pilot; ceilings are dropping toward the hills ahead and passengers are eager to get home. The soundest decision is to…",
      opts:["Descend and press on beneath the clouds","Divert or land and wait until conditions improve","Climb up through the layer to get on top","Speed up to beat the weather to the field"], correct:1,
      why:"Deteriorating VFR into rising terrain is a classic fatal setup. Diverting or waiting costs time; scud-running or blundering into IMC costs lives. The airplane can always wait on the ground." },
    { cat:"Decision Making", q:"Continued VFR flight into instrument conditions by a non-instrument pilot is so lethal chiefly because…",
      opts:["The engine is likely to ice up and quit","Loss of the visual horizon causes spatial disorientation and loss of control","Radios stop working inside cloud","It is merely a paperwork violation"], correct:1,
      why:"Studies famously put the average survival time at roughly 178 seconds. Without outside references, the vestibular system misleads the pilot into a spiral — control is lost fast." },
    { cat:"Decision Making", q:"En route your fuel burn is running higher than planned, and you now project arriving below your legal reserve. The proactive choice is to…",
      opts:["Continue and hope for a tailwind","Divert now to a nearer airport and refuel","Lean aggressively and carry on","Wait to act until the low-fuel light comes on"], correct:1,
      why:"Decide early, while options are plentiful. Diverting to refuel is cheap and safe; pressing on until fuel is critical removes every margin — many fuel-exhaustion accidents began with a “we'll probably make it.”" },
    { cat:"Decision Making", q:"A passenger urgently needs to be somewhere, but the weather is below your personal minimums. The professional response is to…",
      opts:["Bend your minimums just this once — it's important","Hold firm to your personal minimums and delay or cancel","Let the passenger make the go/no-go call","Depart and re-evaluate once airborne"], correct:1,
      why:"Personal minimums exist precisely to remove pressure from the moment. If they bend under a schedule, they aren't minimums. Get-there-itis is a leading factor in weather accidents." },
    { cat:"Risk Management", q:"The “error chain” (Swiss-cheese) model teaches that most accidents result from…",
      opts:["A single catastrophic mechanical failure","A sequence of small errors and holes lining up — any one of which, broken, could have prevented it","Pilot error and nothing else","Bad weather in essentially every case"], correct:1,
      why:"Accidents are usually a chain of minor links. Recognizing and breaking any single link — ideally the earliest, the go/no-go decision — stops the sequence." },
    { cat:"Decision Making", q:"The “sterile cockpit” concept calls for…",
      opts:["Only one pilot speaking on the radio","No non-essential activities or conversation during critical phases of flight","A physically clean, uncluttered flight deck","No passengers seated up front"], correct:1,
      why:"During taxi, takeoff, approach and landing (below 10,000 ft for airlines), chatter and distractions are set aside so attention stays on flying the aircraft." },

    /* ---- Aerodynamics (expanded) ---- */
    { cat:"Aerodynamics", q:"Induced drag — the drag penalty of producing lift — is greatest when the aircraft is flying…",
      opts:["Fast, at low angle of attack","Slow, at high angle of attack","At cruise speed only","It never changes with speed"], correct:1,
      why:"Induced drag rises as angle of attack increases, so it dominates at low speed (slow flight, climb, approach). Parasite drag, by contrast, grows with speed — the two cross near best-glide/L-Dmax." },
    { cat:"Aerodynamics", q:"Ground effect — the reduction in induced drag near the surface — is significant within roughly…",
      opts:["One wingspan of the ground","Ten wingspans of the ground","500 feet of the ground","Only while the wheels touch"], correct:0,
      why:"Within about one wingspan of the surface the ground disrupts wingtip vortices and downwash, cutting induced drag. It can let an overloaded aircraft lift off but then fail to climb out." },
    { cat:"Aerodynamics", q:"A wing's aspect ratio is the ratio of…",
      opts:["Thickness to chord","Wingspan to mean chord","Lift to drag","Root chord to tip chord"], correct:1,
      why:"Aspect ratio ≈ span²/area. High-aspect-ratio wings (gliders) have much less induced drag, which is why they glide so efficiently; low-aspect-ratio wings favor speed and maneuvering." },
    { cat:"Aerodynamics", q:"“Washout” — a built-in twist reducing the angle of incidence toward the wingtips — exists so that…",
      opts:["The wingtips stall before the root","The wing root stalls before the tips","Both stall simultaneously","Top speed increases"], correct:1,
      why:"Washout makes the root stall first, keeping airflow attached at the tips where the ailerons are — so roll control survives into the early stall and spin tendencies are reduced." },
    { cat:"Aerodynamics", q:"Sweeping a wing back is done chiefly to…",
      opts:["Increase low-speed lift","Delay the onset of compressibility (raise critical Mach)","Improve short-field takeoff","Reduce fuel burn at idle"], correct:1,
      why:"Sweep lowers the effective airflow speed across the wing, delaying shockwave formation and letting jets cruise efficiently closer to the speed of sound — at the cost of poorer low-speed behavior." },
    { cat:"Aerodynamics", q:"Wing dihedral (tips higher than the roots) primarily improves…",
      opts:["Pitch (longitudinal) stability","Lateral (roll) stability","Directional (yaw) stability","Maximum speed"], correct:1,
      why:"When a dihedral aircraft is disturbed into a bank and sideslips, the lower wing meets the relative wind at a higher angle of attack and lifts, rolling the aircraft back toward level." },
    { cat:"Aerodynamics", q:"Adverse yaw causes an aircraft rolling into a turn to initially yaw…",
      opts:["Toward the inside of the turn","Toward the outside of the turn (opposite the roll)","Straight ahead with no yaw","Nose-down"], correct:1,
      why:"The rising (outer) wing's down-aileron makes more lift and more drag, yawing the nose the wrong way — toward the outside. Coordinated rudder into the turn cancels it." },
    { cat:"Aerodynamics", q:"Small vortex generators on a wing's upper surface work by…",
      opts:["Adding lift directly like tiny wings","Energizing the boundary layer to delay flow separation","Reducing the aircraft's weight","Cooling the wing structure"], correct:1,
      why:"They stir high-energy air into the sluggish boundary layer, keeping it attached to higher angles of attack — improving control authority and lowering stall speed." },

    /* ---- V-speeds & airspeed markings ---- */
    { cat:"Performance", q:"VNE, marked by the red radial line on the airspeed indicator, is the…",
      opts:["Best rate-of-climb speed","Never-exceed speed","Maneuvering speed","Stall speed"], correct:1,
      why:"VNE is the never-exceed speed; flying beyond it risks structural failure or flutter. Never operate into or past the red line." },
    { cat:"Performance", q:"Maneuvering speed (VA) is the maximum speed at which…",
      opts:["The flaps may be extended","Full or abrupt control deflection won't overstress the airframe","The landing gear may be lowered","The aircraft can be safely stalled"], correct:1,
      why:"At or below VA the wing stalls before aerodynamic loads exceed structural limits. VA decreases as weight decreases, so a light aircraft must slow further in turbulence." },
    { cat:"Performance", q:"VFE is the maximum speed with…",
      opts:["Flaps extended","The gear extended","Flaps retracted","One engine inoperative"], correct:0,
      why:"VFE (top of the white arc) is the flaps-extended speed limit; exceeding it can damage the extended flaps or their mechanism." },
    { cat:"Performance", q:"VSO is the stalling speed in the…",
      opts:["Clean (cruise) configuration","Landing configuration (gear and flaps down)","Best-glide configuration","Maximum-weight climb"], correct:1,
      why:"VSO — the bottom of the white arc — is the power-off stall speed in the landing configuration; VS1 (bottom of the green arc) is the clean-configuration stall speed." },
    { cat:"Performance", q:"The white arc on the airspeed indicator marks the…",
      opts:["Never-exceed range","Flap operating range","Caution (high-speed) range","Best-glide range"], correct:1,
      why:"The white arc spans from VSO up to VFE — the flap operating range. The green arc is normal operations; the yellow arc is a smooth-air-only caution range; the red line is VNE." },
    { cat:"Performance", q:"The green arc on the airspeed indicator represents the…",
      opts:["Flap operating range","Normal operating range","Caution range for smooth air only","Never-exceed range"], correct:1,
      why:"The green arc runs from the clean stall speed (VS1) to the maximum structural cruising speed (VNO) — the normal operating range for everyday flight." },
    { cat:"Performance", q:"Flying at “best glide speed” after an engine failure gives you…",
      opts:["The steepest possible descent","The greatest gliding distance over the ground (in still air)","The slowest possible descent rate","The highest airspeed"], correct:1,
      why:"Best glide is the speed for maximum lift-to-drag ratio, yielding the most distance per foot of altitude lost — buying the most options to reach a landing site." },
    { cat:"Performance", q:"During a power-off glide, extending the flaps will generally…",
      opts:["Extend the glide distance","Steepen the descent and shorten the glide","Have no effect on the glide","Increase the glide speed"], correct:1,
      why:"Flaps add drag and lower the lift-to-drag ratio, steepening the descent path. Handy for losing height to hit a spot — but they reduce how far you can reach." },

    /* ---- Weather (expanded) ---- */
    { cat:"Weather", q:"A fast-moving cold front is typically associated with…",
      opts:["Gentle, widespread stratiform cloud and steady rain","Abrupt lifting, cumuliform clouds, showers or thunderstorms and gusty winds","Clear skies and light winds","Persistent fog only"], correct:1,
      why:"The steep leading edge of cold, dense air forces warm air up sharply, building towering cumulus and storms with a narrow but violent band of weather and shifting, gusty winds." },
    { cat:"Weather", q:"A warm front usually brings…",
      opts:["Sudden thunderstorms and hail","Gradual lift with layered stratiform clouds, steady precipitation and lowering visibility over a wide area","Strong clear-air turbulence","Rapidly improving conditions"], correct:1,
      why:"Warm air overrunning cooler air aloft produces broad, layered cloud and prolonged steady rain or drizzle with poor visibility — a slower, wider weather system than a cold front." },
    { cat:"Weather", q:"A TAF differs from a METAR in that a TAF is…",
      opts:["An observation of current conditions","A forecast for the vicinity of an airport over a set period","A chart of winds aloft","A NOTAM about the airport"], correct:1,
      why:"A METAR reports observed conditions now; a TAF forecasts expected conditions within about 5 SM of an airport, typically over the next 24–30 hours." },
    { cat:"Weather", q:"A SIGMET is issued to warn of…",
      opts:["Routine wind and temperature changes","Weather significant to all aircraft — severe turbulence or icing, volcanic ash, dust or sandstorms","Minor turbulence affecting light aircraft only","Airport lighting outages"], correct:1,
      why:"SIGMETs cover hazards dangerous to all aircraft. AIRMETs cover less severe conditions (moderate turbulence/icing, IFR, mountain obscuration) of more concern to lighter aircraft." },
    { cat:"Weather", q:"The three ingredients required for a thunderstorm are moisture, a lifting force, and…",
      opts:["High pressure","An unstable atmosphere (steep lapse rate)","Calm surface winds","A temperature inversion"], correct:1,
      why:"You need water vapor, an unstable lapse rate so a lifted parcel keeps rising on its own, and a trigger to start the lift (heating, fronts, terrain)." },
    { cat:"Weather", q:"The most hazardous stage of a thunderstorm's life cycle for aircraft is the…",
      opts:["Cumulus stage","Mature stage","Dissipating stage","Anvil stage"], correct:1,
      why:"In the mature stage updrafts and downdrafts coexist violently alongside heavy rain, hail, lightning and severe wind shear — the most dangerous time to be anywhere near the cell." },
    { cat:"Weather", q:"A microburst encountered on final approach is dangerous because it produces…",
      opts:["A steady, easily corrected headwind","A rapid shift from performance-boosting headwind to a sinking tailwind","Only light turbulence","Improved climb performance"], correct:1,
      why:"An aircraft flies into the outflow's headwind (lift increases), then through the downdraft and out the far side as a tailwind — a sudden, potentially unrecoverable loss of performance. Go around early." },
    { cat:"Weather", q:"Mountain-wave turbulence typically forms…",
      opts:["Upwind of a ridge in calm air","Downwind of a ridge when strong winds blow across it through a stable layer","Only at night","Directly over flat terrain"], correct:1,
      why:"Stable air forced over a ridge oscillates in standing waves downwind, with severe turbulence and rotor clouds beneath the wave crests — and powerful up- and down-drafts." },
    { cat:"Weather", q:"Encountering freezing rain in flight tells you that…",
      opts:["The air is uniformly below freezing","There is a layer of warmer, above-freezing air above you","You are above all cloud","Icing is impossible"], correct:1,
      why:"Rain implies it fell as liquid from a warmer layer aloft, then supercooled in the colder air below — so climbing (into the warm layer) may be a safer escape than descending." },
    { cat:"Weather", q:"Density altitude is pressure altitude corrected for…",
      opts:["Wind speed","Nonstandard temperature","Magnetic variation","Aircraft weight"], correct:1,
      why:"High density altitude (hot, high, humid) means thin air: less lift, less thrust, and worse climb. It's the altitude the aircraft “feels” it's performing at, regardless of the field elevation." },
    { cat:"Weather", q:"The standard (average) temperature lapse rate in the lower atmosphere is about…",
      opts:["1°C per 1,000 ft","2°C per 1,000 ft","5°C per 1,000 ft","No change with altitude"], correct:1,
      why:"The standard lapse rate is roughly 2°C (about 3.5°F) per 1,000 ft, or 6.5°C per kilometer — the baseline behind altimetry and performance charts." },
    { cat:"Weather", q:"Advection fog forms when…",
      opts:["The ground cools on a clear, calm night","Warm, moist air moves horizontally over a cooler surface","Air is forced up a mountain slope","Rain falls through a dry layer"], correct:1,
      why:"Advection fog needs wind to carry warm moist air over a cold surface (e.g. sea air over cool land) and, unlike radiation fog, can persist in a breeze." },
    { cat:"Weather", q:"Radiation fog is most likely…",
      opts:["On a clear, calm night as the ground cools, often in low-lying areas","During strong gusty winds","In the middle of a sunny afternoon","Only over open ocean"], correct:0,
      why:"On clear, calm nights the ground radiates heat away, cooling the air just above it to its dewpoint — classic valley fog that usually burns off after sunrise." },

    /* ---- Navigation & instruments (expanded) ---- */
    { cat:"Navigation", q:"Magnetic variation is the angular difference between…",
      opts:["True north and magnetic north","Magnetic north and compass north","Your heading and your track","Indicated and true airspeed"], correct:0,
      why:"Variation is the local angle between true and magnetic north, shown by isogonic lines on charts. It's applied to convert true directions to magnetic ones (and vice versa)." },
    { cat:"Navigation", q:"Compass “deviation” is error caused by…",
      opts:["The Earth's magnetic field tilting","Magnetic fields generated by the aircraft itself","Turning too quickly","Flying at high altitude"], correct:1,
      why:"The aircraft's own electrical systems and ferrous metal deflect the compass. A compass correction card lists the residual deviation on various headings after swinging the compass." },
    { cat:"Navigation", q:"On an easterly or westerly heading in the Northern Hemisphere, accelerating makes the magnetic compass show an apparent turn toward the…",
      opts:["South","North","East","West"], correct:1,
      why:"The memory aid is ANDS: Accelerate–North, Decelerate–South. Acceleration errors show a false turn toward north when speeding up on an east/west heading (and toward south when slowing)." },
    { cat:"Navigation", q:"GPS determines an aircraft's position by…",
      opts:["Measuring bearings to ground stations","Measuring range from multiple satellites (needing at least four for a 3-D fix)","Timing radio echoes off the ground","Reading the Earth's magnetic field"], correct:1,
      why:"Each satellite gives a range sphere; the receiver solves for the intersection. Four satellites resolve latitude, longitude, altitude and the receiver's clock error." },
    { cat:"Navigation", q:"RNAV (area navigation) lets an aircraft…",
      opts:["Fly only directly to and from ground navaids","Fly any desired course within the coverage of its nav sources","Navigate only with a magnetic compass","Operate only in Class A airspace"], correct:1,
      why:"RNAV frees the aircraft from flying station-to-station, allowing direct or arbitrary routes using GPS, DME/DME, or inertial systems — the basis of modern airway and approach design." },
    { cat:"Navigation", q:"DME (distance measuring equipment) provides…",
      opts:["Magnetic bearing to a station","Slant-range distance to a station","Ground speed only","Altitude above the station"], correct:1,
      why:"DME reports slant range — the straight-line distance to the station, which is slightly more than the ground distance, noticeably so directly overhead at altitude." },
    { cat:"Instruments", q:"The altimeter is essentially a form of…",
      opts:["Gyroscope","Aneroid barometer","Accelerometer","Magnetometer"], correct:1,
      why:"Sealed aneroid capsules expand and contract as static (ambient) pressure changes with altitude, driving the needles. Setting the Kollsman window calibrates it to the local pressure." },
    { cat:"Instruments", q:"The vertical speed indicator (VSI) works by measuring the…",
      opts:["Rate of change of static pressure","Ram (pitot) pressure","Gyroscopic precession","Outside air temperature"], correct:0,
      why:"The VSI compares instantaneous static pressure with a calibrated leak, so it reads the rate at which static pressure is changing — i.e. climb or descent rate, with a slight lag." },
    { cat:"Instruments", q:"If you fly toward lower pressure without updating the altimeter setting, your altimeter will read…",
      opts:["Lower than your true altitude","Higher than your true altitude","Exactly your true altitude","Zero"], correct:1,
      why:"“High to low, look out below.” Flying into lower pressure (or colder air) leaves the altimeter over-reading — you're actually lower than it indicates, a real terrain hazard." },
    { cat:"Instruments", q:"Setting the altimeter to 29.92 inHg (standard) makes it display…",
      opts:["True altitude above sea level","Pressure altitude (used for flight levels)","Height above the ground","Density altitude"], correct:1,
      why:"Above the transition altitude (18,000 ft in the U.S.) everyone sets 29.92 so all aircraft reference the same datum — pressure altitude — read as flight levels (e.g. FL350)." },
    { cat:"Instruments", q:"The ball of the turn coordinator's inclinometer tells you…",
      opts:["The rate of turn","Whether the turn is coordinated (slipping or skidding)","The bank angle in degrees","The pitch attitude"], correct:1,
      why:"Ball centered = coordinated. Ball to the inside = slip (too little rudder); ball to the outside = skid (too much rudder). “Step on the ball” to center it." },

    /* ---- Systems (expanded) ---- */
    { cat:"Systems", q:"A normally aspirated (non-turbocharged) piston engine loses power with altitude because…",
      opts:["The propeller spins slower","The air density, and thus available oxygen, decreases","The oil gets too cold","The magnetos weaken"], correct:1,
      why:"Less dense air means less oxygen per intake stroke, so the engine makes less power the higher it climbs — one reason service ceilings exist for piston aircraft." },
    { cat:"Systems", q:"A turbocharger benefits an aircraft engine by…",
      opts:["Cooling the exhaust","Compressing intake air to maintain manifold pressure at altitude","Reducing propeller drag","Replacing the magnetos"], correct:1,
      why:"Driven by exhaust gas, the turbocharger packs more air into the cylinders, letting the engine hold near–sea-level power far higher — restoring climb and cruise performance up high." },
    { cat:"Systems", q:"Carburetor icing is most insidious because it can occur…",
      opts:["Only at full power in freezing conditions","At reduced power in moist air even when the outside temperature is well above freezing","Only above 10,000 ft","Only during engine start"], correct:1,
      why:"Fuel vaporization and the pressure drop in the venturi can chill the carburetor below freezing on a mild, humid day — often at low power on descent. Carb heat is the cure and the check." },
    { cat:"Systems", q:"Detonation in a piston engine is…",
      opts:["The normal, smooth burning of the fuel/air charge","An uncontrolled explosion of the charge causing damaging pressures and temperatures","The sound of the starter engaging","A deliberate lean-of-peak technique"], correct:1,
      why:"Instead of a controlled flame front, the mixture explodes — spiking cylinder pressure and temperature. Causes include too-low-octane fuel, excessive heat, or over-leaning at high power." },
    { cat:"Systems", q:"Aircraft piston engines use magnetos for ignition mainly because they…",
      opts:["Are lighter than spark plugs","Produce spark independently of the aircraft's electrical system","Improve fuel economy at idle","Eliminate the need for oil"], correct:1,
      why:"Engine-driven magnetos generate their own spark, so the engine keeps running even with a total electrical failure — and dual magnetos add redundancy and a small power benefit." },
    { cat:"Systems", q:"A constant-speed propeller holds a selected RPM by…",
      opts:["Changing engine displacement","Automatically varying the blade pitch via a governor","Adjusting the mixture","Feathering on every power change"], correct:1,
      why:"The governor increases blade pitch (bigger “bite”) as load or airspeed changes to keep RPM constant — like a car's automatic transmission finding the right gear for the conditions." },
    { cat:"Systems", q:"Airliners typically maintain a cabin pressure equivalent to an altitude of no more than about…",
      opts:["Sea level","8,000 feet","20,000 feet","The actual cruise altitude"], correct:1,
      why:"Cruising near 35,000 ft, the cabin is pressurized to roughly 6,000–8,000 ft so occupants stay comfortable and adequately oxygenated without needing supplemental oxygen." },
    { cat:"Systems", q:"The pitot-static system supplies the…",
      opts:["Attitude and heading indicators","Airspeed indicator, altimeter and vertical speed indicator","Fuel and oil gauges","Engine tachometer"], correct:1,
      why:"Ram air (pitot) plus ambient (static) pressure drive the three pressure instruments. That's why a blocked port corrupts airspeed, altitude and vertical speed together." },
    { cat:"Systems", q:"Hot high-pressure “bleed air” tapped from the engine compressor is commonly used for…",
      opts:["Charging the battery","Cabin pressurization and anti-ice","Powering the landing lights","Driving the propeller"], correct:1,
      why:"Compressor bleed air feeds pressurization/air-conditioning packs and heats leading edges and engine inlets for ice protection — one reason engine bleed settings matter in icing." },

    /* ---- Airspace, regs & operations (expanded) ---- */
    { cat:"Airspace / Regs", q:"In the U.S., Class A airspace extends from…",
      opts:["The surface to 1,200 ft AGL","18,000 ft MSL up to FL600, IFR only","10,000 ft MSL to 18,000 ft MSL","Only over oceanic routes"], correct:1,
      why:"From 18,000 ft MSL to FL600 everything is IFR, under ATC clearance, with altimeters set to 29.92. VFR flight is not permitted in Class A." },
    { cat:"Airspace / Regs", q:"Class C airspace is generally established around airports that have…",
      opts:["No control tower","An operating control tower, radar approach control and moderate traffic","Only military operations","Grass runways"], correct:1,
      why:"Class C requires two-way radio communication and a Mode C transponder. It's drawn as a smaller two-tiered cake around busy-but-not-Class-B airports." },
    { cat:"Airspace / Regs", q:"Class G airspace is best described as…",
      opts:["The busiest airspace in the system","Uncontrolled airspace where ATC exercises no separation authority","Reserved for airliners","Always above 18,000 ft"], correct:1,
      why:"In Class G (uncontrolled) airspace ATC provides no separation service; pilots are responsible for see-and-avoid, and VFR weather minimums are lower, especially below 1,200 ft AGL." },
    { cat:"Airspace / Regs", q:"A Special VFR clearance allows a pilot to…",
      opts:["Fly IFR without an instrument rating","Operate VFR in controlled airspace below basic VFR minimums (1 SM, clear of clouds) with ATC approval","Ignore the transponder requirement","Land at any closed airport"], correct:1,
      why:"On request and if traffic permits, ATC may issue Special VFR down to 1 statute mile visibility and clear of clouds within surface-area controlled airspace — a tool to be used with caution." },
    { cat:"Airspace / Regs", q:"In the U.S., a Mode C transponder (altitude reporting) is generally required…",
      opts:["Only in Class G airspace","In and above Class B and C, and above 10,000 ft MSL (with limited exceptions)","Only at night","Never for light aircraft"], correct:1,
      why:"Mode C (now paired with ADS-B Out) is required within Class B/C, above the Class B “Mode C veil,” and above 10,000 ft MSL except when at or below 2,500 ft AGL." },
    { cat:"Airspace / Regs", q:"Among aircraft in flight, absolute right of way belongs to…",
      opts:["The fastest aircraft","An aircraft in distress","The heaviest aircraft","The aircraft at the highest altitude"], correct:1,
      why:"An aircraft in distress has right of way over all other traffic — everyone else gives way. Otherwise category rules apply (e.g. balloons over gliders over airplanes)." },
    { cat:"Operations", q:"When one aircraft overtakes another in flight, the…",
      opts:["Overtaking aircraft has right of way and passes on the left","Aircraft being overtaken has right of way; the overtaking aircraft alters course to the right","Faster aircraft always has right of way","Two must descend together"], correct:1,
      why:"The aircraft being passed keeps the right of way; the overtaking aircraft must give way and move to the right to pass — mirroring the rules of the road." },

    /* ---- Human factors (expanded) ---- */
    { cat:"Human Factors", q:"Hyperventilation produces symptoms that mimic hypoxia. The correct response is to…",
      opts:["Climb higher for fresh air","Consciously slow the breathing rate (and talk aloud or breathe into a bag)","Breathe faster and deeper","Ignore it — it is harmless"], correct:1,
      why:"Over-breathing flushes out CO₂, causing dizziness and tingling. Slowing the rate restores balance. Because the symptoms overlap with hypoxia, at altitude assume hypoxia first — use oxygen." },
    { cat:"Human Factors", q:"Carbon monoxide poisoning in the cockpit most often comes from…",
      opts:["High-altitude flight","Exhaust gases leaking into a cabin heater","Bright sunlight","Dehydration"], correct:1,
      why:"CO is odorless and binds hemoglobin far more readily than oxygen. A cracked exhaust shroud feeding the cabin heat is the classic source — headache and drowsiness are warning signs; use fresh air and land." },
    { cat:"Human Factors", q:"The somatogravic illusion — powerful on a dark night or over water — makes rapid forward acceleration feel like…",
      opts:["A nose-down pitch","A nose-up pitch (tempting a dangerous nose-down correction)","A roll to the left","No change at all"], correct:1,
      why:"Acceleration pushes you back into the seat, which the inner ear reads as pitching up. Pilots may push the nose down to “correct” — straight toward the ground. Trust the attitude indicator." },
    { cat:"Human Factors", q:"The “black-hole” approach illusion, over dark featureless terrain at night, tends to make pilots…",
      opts:["Fly a dangerously low approach","Fly too high and go around","See the runway more clearly","Land long every time"], correct:0,
      why:"With no visual cues between the aircraft and a distant runway, pilots perceive themselves as too high and descend too soon — flying an unsafely low, flat approach short of the runway." },
    { cat:"Decision Making", q:"“Scud running” — pressing on beneath a lowering ceiling in marginal visibility — is dangerous mainly because it invites…",
      opts:["Carburetor icing","Controlled flight into terrain and obstacles","Excess fuel burn","Radio interference"], correct:1,
      why:"Squeezing between a dropping cloud base and rising terrain leaves no margin for towers, wires or hills that appear with no time to react. It's a leading cause of CFIT — divert or climb to VFR-on-top isn't an option without a rating." },

    /* ================= EXPANSION TO 200 ================= */

    /* ---- Flight mechanics & aerodynamics ---- */
    { cat:"Flight Mechanics", q:"A spin differs from a simple stall in that a spin also involves…",
      opts:["Both wings producing equal lift","Autorotation — one wing more deeply stalled than the other","An engine failure","Excess airspeed"], correct:1,
      why:"In a spin the aircraft is stalled AND yawing, so one wing is more stalled (less lift, more drag) than the other, driving the self-sustaining autorotation." },
    { cat:"Flight Mechanics", q:"In the PARE spin-recovery mnemonic, the “R” directs you to apply…",
      opts:["Rudder full opposite to the direction of rotation","Rapid aileron into the spin","Rich mixture","Reduced flaps"], correct:0,
      why:"PARE: Power idle, Ailerons neutral, Rudder full opposite the spin, then Elevator briskly forward to break the stall. Rudder stops the rotation before the elevator reduces angle of attack." },
    { cat:"Flight Mechanics", q:"A “secondary stall” typically occurs when a pilot…",
      opts:["Recovers from the first stall too abruptly, exceeding the critical angle again","Adds full power too slowly","Uses too much rudder on the ground","Lowers the flaps in cruise"], correct:0,
      why:"Pulling back too soon or too hard during recovery re-exceeds the critical angle of attack before the wing is truly flying, producing a second, often more aggressive stall." },
    { cat:"Flight Mechanics", q:"Engine torque reaction tends to roll a typical single-engine propeller aircraft…",
      opts:["To the right","To the left (opposite the propeller's rotation)","Straight ahead","Nose-up"], correct:1,
      why:"By Newton's third law, a propeller turning clockwise (as seen from the cockpit) reacts by rolling the airframe left — one of the left-turning tendencies, strongest at high power and low speed." },
    { cat:"Flight Mechanics", q:"An accelerated stall happens because…",
      opts:["The engine is over-boosted","Increased load factor raises the stall speed, so the wing stalls at a higher airspeed","The flaps are retracted","The air is too cold"], correct:1,
      why:"Stall speed rises with the square root of load factor, so hard maneuvering (steep turns, abrupt pull-ups) can stall the wing well above the 1-G stall speed." },
    { cat:"Flight Mechanics", q:"Loading an aircraft toward its FORWARD CG limit tends to…",
      opts:["Reduce stability and lighten the controls","Increase stability but raise stall speed and heavy up the elevator/flare","Have no effect on handling","Make the aircraft tail-heavy"], correct:1,
      why:"A forward CG increases longitudinal stability but demands more tail download — raising stall speed, heavying the pitch controls, and potentially making the landing flare difficult." },
    { cat:"Flight Mechanics", q:"For a given wing, the lift produced is proportional to the…",
      opts:["Airspeed","Square of the airspeed","Cube of the airspeed","Square root of the airspeed"], correct:1,
      why:"Lift rises with the square of velocity (L ∝ V²), which is why small speed changes have a large effect on lift and on stall margin." },
    { cat:"Flight Mechanics", q:"The angle of incidence is the fixed angle between the wing chord line and the…",
      opts:["Relative wind","Longitudinal axis of the fuselage","Horizon","Flight path"], correct:1,
      why:"Angle of incidence is a rigging angle built into the airframe. Angle of attack, by contrast, is the changing angle between the chord and the relative wind." },
    { cat:"Flight Mechanics", q:"Leading-edge slats or slots raise the wing's maximum lift by…",
      opts:["Reducing the wing area","Energizing airflow and letting the wing reach a higher angle of attack before stalling","Cooling the wing","Increasing the never-exceed speed"], correct:1,
      why:"They re-energize the boundary layer and effectively increase camber, delaying separation to a higher angle of attack — lowering stall speed for takeoff and landing." },
    { cat:"Flight Mechanics", q:"Dutch roll is best described as a coupled…",
      opts:["Pitch-and-power oscillation","Yaw-and-roll oscillation","Nose-up trim runaway","Wingtip vortex"], correct:1,
      why:"Dutch roll is a lateral-directional wobble in which yaw and roll feed each other — common on swept-wing jets and damped by a yaw damper." },
    { cat:"Flight Mechanics", q:"In a steep turn, the “overbanking tendency” arises because…",
      opts:["The inside wing flies faster","The outside wing travels faster and makes more lift, steepening the bank","The rudder loses effect","The elevator stalls"], correct:1,
      why:"The higher-speed outer wing generates more lift, tending to roll the aircraft into a steeper bank — so a steep turn often needs a little opposite aileron to hold bank." },
    { cat:"Flight Mechanics", q:"Higher wing loading (more weight per unit of wing area) generally gives an aircraft…",
      opts:["A rougher ride in turbulence","A smoother ride in turbulence","A lower stall speed","Better short-field performance"], correct:1,
      why:"A heavily wing-loaded aircraft responds less to gusts, riding turbulence more smoothly — one reason large jets feel steadier than light trainers in bumps." },

    /* ---- Multi-engine ---- */
    { cat:"Multi-Engine", q:"On a conventional twin (both propellers turning clockwise), the “critical engine” is the…",
      opts:["Left engine","Right engine","Either — they are identical","Whichever is at higher power"], correct:0,
      why:"P-factor puts each propeller's effective thrust to the right of center. Losing the LEFT engine leaves the right engine's thrust line farthest from the CG — the most adverse yaw — making the left the critical engine." },
    { cat:"Multi-Engine", q:"VMC, marked by a red radial line on a twin's airspeed indicator, is the…",
      opts:["Maximum cruise speed","Minimum speed to maintain directional control with the critical engine failed","Best glide speed","Maneuvering speed"], correct:1,
      why:"Below VMC (minimum control speed) the rudder can no longer counter the asymmetric thrust of a failed engine, and the aircraft will yaw and roll toward the dead engine." },
    { cat:"Multi-Engine", q:"VYSE — the blue radial line on a twin — is the speed for…",
      opts:["Best single-engine rate of climb","Best glide with both engines out","Maximum structural cruising","Flap extension"], correct:0,
      why:"“Blue line” is the best single-engine rate-of-climb speed — the target after an engine failure to preserve the most climb performance on the remaining engine." },
    { cat:"Multi-Engine", q:"Feathering the propeller of a failed engine is done to…",
      opts:["Restart the engine","Minimize drag by turning the blades edge-on to the airflow","Increase lift","Cool the engine faster"], correct:1,
      why:"A windmilling propeller creates enormous drag. Feathering rotates the blades parallel to the airflow, drastically cutting drag so the aircraft can still climb or hold altitude." },

    /* ---- Performance & airspeed ---- */
    { cat:"Performance", q:"VS1, the bottom of the green arc, is the stalling speed in the…",
      opts:["Landing configuration","Clean (cruise) configuration","Best-glide configuration","Maximum-bank turn"], correct:1,
      why:"VS1 is the power-off clean-configuration stall speed. VSO (bottom of the white arc) is the stall speed with gear and flaps extended." },
    { cat:"Performance", q:"The top of the green arc (VNO) marks the…",
      opts:["Never-exceed speed","Maximum structural cruising speed — exceed it only in smooth air","Stall speed","Flap limit speed"], correct:1,
      why:"Above VNO you're in the yellow caution arc, safe only in smooth air; the red line (VNE) is the absolute limit in any conditions." },
    { cat:"Performance", q:"The yellow arc on the airspeed indicator is a caution range to be used only…",
      opts:["At night","In smooth air","Below 1,000 ft","With flaps down"], correct:1,
      why:"The yellow arc (between VNO and VNE) is safe only in smooth air; a sharp gust or abrupt input there could overstress the airframe." },
    { cat:"Performance", q:"An airplane's service ceiling is defined as the altitude where the maximum rate of climb drops to about…",
      opts:["0 ft/min","100 ft/min","500 ft/min","1,000 ft/min"], correct:1,
      why:"Service ceiling is where the best climb rate falls to 100 fpm; the absolute ceiling (0 fpm) is higher but of little practical use." },
    { cat:"Performance", q:"A steady headwind on takeoff and landing…",
      opts:["Increases the ground roll required","Decreases the ground roll required","Has no effect","Only matters at night"], correct:1,
      why:"A headwind means the aircraft reaches flying airspeed at a lower groundspeed, shortening the takeoff and landing roll. A tailwind does the opposite and is best avoided." },
    { cat:"Performance", q:"An aircraft's rate of climb depends primarily on its…",
      opts:["Excess power available over power required","Total fuel on board","Wing color","Cabin altitude"], correct:0,
      why:"Climb performance comes from surplus power (or thrust). As density altitude rises and power available falls toward power required, climb rate shrinks toward zero at the ceiling." },

    /* ---- Weather (further) ---- */
    { cat:"Weather", q:"An occluded front forms when…",
      opts:["Two warm fronts merge","A faster cold front overtakes a warm front, lifting the warm air off the surface","A front stops moving","Warm air undercuts cold air"], correct:1,
      why:"The cold front catches the slower warm front, wedging the warm air aloft. Occlusions bring a mix of frontal weather and are common in mature low-pressure systems." },
    { cat:"Weather", q:"A stationary front is one where…",
      opts:["The front is moving very fast","Neither air mass is displacing the other, so the boundary stalls","Only clear skies occur","It exists only over oceans"], correct:1,
      why:"With opposing air masses at a standoff, the boundary barely moves and can bring prolonged clouds and precipitation over the same area for days." },
    { cat:"Weather", q:"Clear (glaze) ice, the most dangerous airframe icing, forms from…",
      opts:["Tiny droplets freezing instantly","Large supercooled droplets spreading and freezing slowly into a smooth, heavy glaze","Snow sticking to the wing","Frost on the ground"], correct:1,
      why:"Large supercooled drops flow back before freezing, forming dense, hard-to-shed clear ice. Small droplets freeze on contact as lighter, rougher rime ice." },
    { cat:"Weather", q:"Clear-air turbulence (CAT) is most associated with…",
      opts:["Low-level fog","The jet stream near the tropopause","Calm high-pressure areas","Ground-effect regions"], correct:1,
      why:"Strong wind shears at the edges of the jet stream generate turbulence in cloudless air — hence “clear-air,” with no visual warning, most common near the tropopause." },
    { cat:"Weather", q:"Smooth, lens-shaped lenticular clouds parked over or downwind of mountains are a sign of…",
      opts:["Fair, stable weather with no hazard","Mountain-wave activity and possible severe turbulence","An approaching warm front","Ground fog"], correct:1,
      why:"Lenticular (and rotor) clouds mark standing mountain waves; the air within can be smooth, but the rotors beneath and the wave itself can hide violent turbulence." },
    { cat:"Weather", q:"The cloud type synonymous with thunderstorms is the…",
      opts:["Cirrus","Cumulonimbus","Stratus","Altocumulus"], correct:1,
      why:"The towering cumulonimbus contains the updrafts, hail, lightning and turbulence of a thunderstorm — to be avoided by a wide margin, often 20 nm from severe cells." },
    { cat:"Weather", q:"A squall line is…",
      opts:["A gentle warm-front cloud deck","A often non-frontal band of intense thunderstorms, frequently the most violent weather","A type of fog","A high-altitude ice cloud"], correct:1,
      why:"Squall lines are lines of storms (often ahead of a cold front) that can be too solid to circumnavigate and contain the worst turbulence, hail and shear — never to be penetrated." },
    { cat:"Weather", q:"Virga — precipitation that evaporates before reaching the ground — is a warning sign of…",
      opts:["Improving weather","Possible strong downdrafts and dry microbursts","Icing on the ground","A stationary front"], correct:1,
      why:"As the falling rain evaporates it cools the air, which can plunge as a powerful downdraft — a classic dry-microburst cue over desert or high-based storms." },
    { cat:"Weather", q:"A temperature inversion (warmer air above cooler) typically produces…",
      opts:["Turbulent, unstable air","Stable, smooth air that traps haze and can hide poor visibility below","Rapid cloud growth","Strong updrafts"], correct:1,
      why:"Inversions cap vertical motion, giving smooth air but trapping moisture, smoke and pollutants beneath — often with fog or low visibility under the inversion layer." },
    { cat:"Weather", q:"A sea breeze occurs when…",
      opts:["Cool air flows from the sea toward warmer land during the day","Warm air flows from land to sea during the day","Winds stop entirely at the coast","The tide changes"], correct:0,
      why:"By day the land heats faster than the water, so cooler, denser marine air flows inland. At night the pattern reverses into a land breeze." },
    { cat:"Weather", q:"In a METAR, the group “24015KT” means the wind is from…",
      opts:["240° at 15 knots","150° at 24 knots","24° at 15 knots","240° at 1,500 ft"], correct:0,
      why:"METAR winds read as direction-then-speed: 240° true at 15 knots. A “G” group (e.g., 24015G25KT) would add gusts to 25 knots." },
    { cat:"Weather", q:"A METAR sky condition of “OVC” indicates cloud coverage of…",
      opts:["1–2 eighths (few)","3–4 eighths (scattered)","5–7 eighths (broken)","8 eighths — overcast"], correct:3,
      why:"Coverage runs FEW, SCT, BKN, OVC. Overcast is a full 8/8 sky cover; BKN or OVC layers form a ceiling." },
    { cat:"Weather", q:"Upslope fog forms when…",
      opts:["Cold air sinks into a valley overnight","Moist, stable air is forced up rising terrain and cools to saturation","A cold front passes","Rain falls through dry air"], correct:1,
      why:"As stable, humid air climbs a slope it cools adiabatically to its dewpoint, forming fog along the rising ground — and, unlike radiation fog, it needs wind to sustain the upslope flow." },

    /* ---- Navigation & instruments (further) ---- */
    { cat:"Navigation", q:"The line on a chart connecting points of zero magnetic variation is the…",
      opts:["Isogonic line","Agonic line","Isobar","Great circle"], correct:1,
      why:"An agonic line joins points where magnetic and true north align (zero variation); isogonic lines connect points of equal non-zero variation." },
    { cat:"Navigation", q:"One minute of latitude equals approximately…",
      opts:["One statute mile","One nautical mile","One kilometer","Ten nautical miles"], correct:1,
      why:"By definition one minute of arc of latitude is one nautical mile (about 1.15 statute miles) — handy for quick distance estimates on a chart." },
    { cat:"Instruments", q:"A standard-rate turn, which the turn coordinator is calibrated to, is…",
      opts:["1° per second","3° per second (a 2-minute 360° turn)","6° per second","10° per second"], correct:1,
      why:"A standard-rate turn is 3° per second, completing 360° in two minutes — the basis of timed turns and holding-pattern entries in instrument flying." },
    { cat:"Navigation", q:"The needle of an ADF (automatic direction finder) points…",
      opts:["To magnetic north","Directly toward the tuned NDB station","Along the runway centerline","Toward the nearest airport"], correct:1,
      why:"The ADF needle always points at the non-directional beacon; its angle from the nose is the relative bearing, which combined with heading gives the magnetic bearing to the station." },
    { cat:"Instruments", q:"Which airspeed will normally be HIGHER than indicated airspeed at altitude?",
      opts:["Calibrated airspeed","True airspeed","Stall speed in IAS","None — they are equal"], correct:1,
      why:"True airspeed exceeds indicated airspeed as air thins with altitude. Calibrated airspeed is just IAS corrected for instrument/position error and stays close to IAS." },
    { cat:"Instruments", q:"A heading indicator (directional gyro) must be reset to the magnetic compass periodically because of…",
      opts:["Magnetic dip","Gyroscopic precession causing gradual drift","Static pressure error","Temperature changes"], correct:1,
      why:"Friction and precession make the DG wander over time, so pilots realign it with the magnetic compass (in straight, unaccelerated flight) roughly every 15 minutes." },
    { cat:"Airports", q:"On a VASI/PAPI, seeing “red over white” (or two red, two white on a PAPI) tells you that you are…",
      opts:["Too high","On the correct glidepath","Too low","Off the runway centerline"], correct:1,
      why:"“Red over white, you're all right.” All white means too high; all red means too low — “red over red, you're dead,” dangerously below the glidepath." },
    { cat:"Airports", q:"A runway numbered “27” is aligned approximately to a magnetic heading of…",
      opts:["27°","270°","207°","027°"], correct:1,
      why:"Runway numbers are the magnetic heading rounded to the nearest 10° with the last zero dropped, so “27” points about 270° (west). The reciprocal end would be “09.”" },
    { cat:"Navigation", q:"Turning to roll out on a northerly heading in the Northern Hemisphere, the magnetic compass tends to…",
      opts:["Overshoot the turn","Lag/undershoot, so you roll out early","Read exactly correct","Spin continuously"], correct:1,
      why:"The memory aid is UNOS: Undershoot North, Overshoot South. Near north the compass lags, so you must roll out before reaching the desired heading." },
    { cat:"Navigation", q:"The angle a pilot holds the aircraft's nose into the wind to track a straight course is the…",
      opts:["Angle of attack","Wind correction (crab) angle","Angle of incidence","Bank angle"], correct:1,
      why:"The wind correction angle offsets drift so the aircraft's track over the ground stays on course even though its heading points partly into the wind." },
    { cat:"Navigation", q:"At a groundspeed of 120 knots, an aircraft covers about…",
      opts:["1 nautical mile per minute","2 nautical miles per minute","3 nautical miles per minute","0.5 nautical miles per minute"], correct:1,
      why:"120 kt ÷ 60 = 2 nm per minute — a quick mental rate for estimating time and distance in flight planning." },
    { cat:"IFR", q:"Flying at or above the published MEA (minimum en route altitude) on an airway guarantees…",
      opts:["Radar coverage everywhere","Obstacle clearance and acceptable navigation-signal reception","The smoothest air","No other traffic"], correct:1,
      why:"The MEA assures both terrain/obstacle clearance and usable navaid reception along that airway segment; the MOCA assures obstacle clearance but signal only within 22 nm of the station." },

    /* ---- Systems (further) ---- */
    { cat:"Systems", q:"The four strokes of a piston aircraft engine's cycle, in order, are…",
      opts:["Compression, intake, power, exhaust","Intake, compression, power, exhaust","Power, exhaust, intake, compression","Intake, power, compression, exhaust"], correct:1,
      why:"Intake, compression, power (combustion), exhaust — the Otto cycle. The single power stroke per two crankshaft revolutions is why smooth running needs multiple cylinders." },
    { cat:"Systems", q:"As a piston aircraft climbs, the pilot leans the mixture because…",
      opts:["The engine needs more fuel up high","Thinner air means less oxygen, so less fuel is needed to keep the correct fuel/air ratio","It cools the cabin","It increases the octane"], correct:1,
      why:"Without leaning, the mixture grows too rich at altitude, wasting fuel, fouling plugs and losing power. Leaning restores the proper ratio for the thinner air." },
    { cat:"Systems", q:"In the United States, 100LL aviation gasoline is dyed…",
      opts:["Blue","Green","Red","Clear/straw"], correct:0,
      why:"100LL (low-lead avgas) is dyed blue for identification. Jet A turbine fuel is a clear-to-straw kerosene — mis-fuelling a piston engine with jet fuel is catastrophic." },
    { cat:"Systems", q:"In many light aircraft the attitude and heading gyros are driven by…",
      opts:["The pitot-static system","An engine-driven vacuum (suction) system","The magnetic compass","Battery power only"], correct:1,
