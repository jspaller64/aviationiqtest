      why:"A vacuum pump spins the gyros with airflow. A vacuum failure quietly kills the attitude and heading indicators — a notorious trap in instrument conditions." },
    { cat:"Systems", q:"Pitot heat is used to…",
      opts:["Warm the cabin","Prevent ice from blocking the pitot tube and corrupting the airspeed indicator","De-ice the wings","Heat the fuel"], correct:1,
      why:"A blocked pitot tube makes the airspeed indicator misbehave (even acting like an altimeter). Pitot heat keeps the ram-air inlet clear in visible moisture and icing." },
    { cat:"Systems", q:"In flight, the aircraft's electrical loads are normally powered by the…",
      opts:["Battery alone","Alternator/generator, with the battery as backup and for starting","Magnetos","Static wicks"], correct:1,
      why:"The engine-driven alternator supplies the buses and recharges the battery in flight; the battery mainly starts the engine and provides a limited reserve if the alternator fails." },
    { cat:"Systems", q:"The sections of a turbine (jet) engine, front to back, are inlet, compressor, then…",
      opts:["Turbine, combustion, exhaust","Combustion, turbine, exhaust","Exhaust, combustion, turbine","Combustion, exhaust, turbine"], correct:1,
      why:"Air is compressed, fuel burns in the combustion chamber, the hot gas spins the turbine (which drives the compressor), and the remainder exits the exhaust as thrust." },
    { cat:"Systems", q:"Pneumatic “de-ice” boots differ from “anti-ice” systems in that boots…",
      opts:["Prevent ice from ever forming","Inflate to crack off ice that has already accumulated","Are used only on the ground","Heat the entire wing continuously"], correct:1,
      why:"De-icing (boots) removes ice after it builds up by flexing the leading edge; anti-icing (heated surfaces, weeping wings) prevents ice from forming in the first place." },
    { cat:"Systems", q:"Exhaust gas temperature (EGT) is monitored primarily to…",
      opts:["Set the landing gear","Lean the fuel/air mixture accurately (find peak EGT)","Time the magnetos","Measure cabin altitude"], correct:1,
      why:"Peak EGT marks the chemically correct mixture; pilots lean to a set number of degrees rich or lean of peak for the desired balance of power, economy and engine temperature." },

    /* ---- Airspace, regs & operations (further) ---- */
    { cat:"Airspace / Regs", q:"Class D airspace generally surrounds…",
      opts:["Uncontrolled fields","Airports with an operating control tower (but without radar approach services)","Only military bases","Oceanic routes"], correct:1,
      why:"Class D wraps a towered airport, typically to about 2,500 ft AGL. Two-way radio communication with the tower is required before entering." },
    { cat:"Airspace / Regs", q:"Over a congested area, the minimum safe VFR altitude is…",
      opts:["500 ft above the ground","1,000 ft above the highest obstacle within a 2,000-ft horizontal radius","200 ft above the tallest building","There is no minimum"], correct:1,
      why:"Over congested areas: at least 1,000 ft above the highest obstacle within 2,000 ft horizontally. Over open areas the minimum is 500 ft AGL (and clear of people/vessels/structures)." },
    { cat:"Operations", q:"An aircraft on final approach to land has right of way over…",
      opts:["No one","Other aircraft in flight or operating on the surface","Only slower aircraft","Only IFR traffic"], correct:1,
      why:"Landing aircraft (and those on final) have priority over aircraft in flight or on the ground — though a pilot may not use that priority to force another off a runway recklessly." },
    { cat:"Operations", q:"Aircraft position and anti-collision lights are required to be on…",
      opts:["At all times","From sunset to sunrise","Only above 10,000 ft","Only in controlled airspace"], correct:1,
      why:"Position (navigation) lights are required from sunset to sunrise; anti-collision lights (beacon/strobes) are used whenever the engine is running, day or night, unless safety dictates otherwise." },
    { cat:"Physiology", q:"Under U.S. rules, the flight crew must use supplemental oxygen when the cabin pressure altitude stays above 12,500 ft MSL for more than…",
      opts:["5 minutes","30 minutes","2 hours","No time limit"], correct:1,
      why:"Above 12,500 ft up to 14,000 ft, required minimum flight crew must use oxygen for any portion beyond 30 minutes; above 14,000 ft they must use it the entire time." },
    { cat:"Airspace / Regs", q:"The mnemonic ARROW refers to documents that must be aboard the aircraft — Airworthiness, Registration, Radio (if required), Operating limitations, and…",
      opts:["Weather briefing","Weight and balance data","Wind charts","Warranty"], correct:1,
      why:"ARROW: Airworthiness certificate, Registration, Radio station license (for international ops), Operating limitations (POH/placards), and Weight & balance data." },
    { cat:"Airspace / Regs", q:"In the U.S., a VFR aircraft not in contact with ATC normally squawks transponder code…",
      opts:["7500","1200","7700","0000"], correct:1,
      why:"1200 is the standard VFR squawk. The emergency/lost-comm codes 7500 (hijack), 7600 (radio failure) and 7700 (emergency) are reserved for those situations." },
    { cat:"Operations", q:"Unless otherwise charted, the standard traffic pattern uses left turns and a pattern altitude of about…",
      opts:["500 ft AGL","1,000 ft AGL","2,500 ft AGL","5,000 ft MSL"], correct:1,
      why:"Left traffic is the default; right traffic is used only where noted. Pattern altitude is typically 1,000 ft AGL for light aircraft (higher for larger/turbine types)." },
    { cat:"Emergencies", q:"A modern Emergency Locator Transmitter (ELT) is designed to broadcast a distress signal on…",
      opts:["121.5 MHz only","406 MHz (with 121.5 for homing)","Any VHF frequency","The transponder"], correct:1,
      why:"406 MHz ELTs transmit a coded, satellite-detected distress signal (often with GPS position) and usually a 121.5 MHz tone for local homing — vastly faster to locate than the old 121.5-only units." },
    { cat:"Operations", q:"A TFR (Temporary Flight Restriction) is issued to…",
      opts:["Permanently close an airport","Restrict flight in a defined area for events such as VIP movements, disasters or hazards","Assign cruising altitudes","Set fuel prices"], correct:1,
      why:"TFRs temporarily bar or limit flight around wildfires, disaster sites, major sporting events, or presidential movements. Busting one can bring interception and enforcement." },

    /* ---- IFR / ATC ---- */
    { cat:"IFR", q:"To operate under Instrument Flight Rules in controlled airspace, a pilot must first…",
      opts:["File a flight plan only","Obtain an ATC clearance","Reach 10,000 ft","Squawk 1200"], correct:1,
      why:"IFR flight in controlled airspace requires an ATC clearance (and a filed flight plan); ATC then provides separation from other IFR traffic." },
    { cat:"IFR", q:"In a standard holding pattern, the turns are…",
      opts:["Left turns","Right turns","Alternating","Straight legs only"], correct:1,
      why:"A standard hold uses right-hand turns with (typically) one-minute legs below 14,000 ft. Non-standard (left-turn) holds are charted or assigned when needed." },
    { cat:"ATC", q:"ATIS — the Automatic Terminal Information Service — provides pilots with…",
      opts:["IFR clearances","A recorded broadcast of current airport weather and operational information","Radar vectors","Fuel prices"], correct:1,
      why:"ATIS continuously broadcasts the latest weather, active runway, approaches in use and NOTAMs, letting pilots get the picture before calling a busy controller." },
    { cat:"ATC", q:"When ATC instructs a pilot to “squawk ident,” the pilot should…",
      opts:["Change to 7700","Press the IDENT button so the aircraft's radar return is highlighted","Turn off the transponder","Read back the altimeter"], correct:1,
      why:"Pressing IDENT briefly enhances the aircraft's symbol on the controller's scope, letting them positively identify which target is yours." },

    /* ---- Human factors & physiology (further) ---- */
    { cat:"Physiology", q:"As altitude increases, a pilot's “time of useful consciousness” after a loss of oxygen…",
      opts:["Increases","Decreases sharply","Stays the same","Becomes unlimited"], correct:1,
      why:"TUC plummets with altitude — several minutes at 18,000 ft but only seconds above 40,000 ft — which is why rapid decompression demands immediate oxygen." },
    { cat:"Physiology", q:"Decompression sickness (“the bends”) is a particular risk for pilots who…",
      opts:["Fly soon after scuba diving","Drink coffee before flight","Fly at night","Skip breakfast"], correct:0,
      why:"Ascending too soon after diving lets dissolved nitrogen form bubbles in the blood and tissues. Standard guidance is to wait 12–24 hours after diving before flying." },
    { cat:"Physiology", q:"For best night vision, a pilot should…",
      opts:["Stare directly at faint objects","Use off-center (peripheral) viewing and allow ~30 minutes to dark-adapt","Look into bright cockpit lights","Close one eye permanently"], correct:1,
      why:"The rod cells that see in darkness cluster off-center and are absent at the fovea, so faint traffic and terrain are best seen slightly off to the side after ~30 minutes of adaptation." },
    { cat:"Physiology", q:"The Coriolis illusion — a violent tumbling sensation — is triggered by…",
      opts:["Bright sunlight","An abrupt head movement during a prolonged constant-rate turn","Low blood sugar","High cabin pressure"], correct:1,
      why:"Moving the head (e.g. to reach a chart) during a steady turn disturbs the inner-ear fluid in multiple canals at once, producing an overwhelming false sensation of rotation." },
    { cat:"Physiology", q:"Autokinesis, a night illusion, is the tendency for…",
      opts:["The horizon to tilt","A single stationary light to appear to move when stared at","Colors to invert","The altimeter to lag"], correct:1,
      why:"Fixating on one static light against a dark background makes it seem to drift, which can lead a pilot to chase a phantom. Scanning and using multiple references prevents it." },
    { cat:"Decision Making", q:"A “graveyard spiral” develops when a disoriented pilot…",
      opts:["Climbs too steeply","In a prolonged descending turn feels level, and pulls back — tightening the spiral","Flies too slowly in cruise","Uses too much flap"], correct:1,
      why:"After the inner ear adapts to a turn, the pilot senses wings level; sensing a descent, they pull back — which only tightens the spiral and increases the dive. Trusting the instruments breaks it." },
    { cat:"Physiology", q:"“Empty-field myopia” at high altitude or over featureless terrain causes the eyes to…",
      opts:["Focus on infinity automatically","Relax to a near focus (~a few feet), missing distant traffic","See only red light","Lose all peripheral vision"], correct:1,
      why:"With nothing to focus on, the relaxed eye focuses only a short distance ahead, so distant aircraft go unseen. Deliberately focusing on a wingtip or distant cloud resets it." },
    { cat:"Risk Management", q:"The in-flight “5P” check prompts a pilot to reassess the Plan, the Plane, the Pilot, the Passengers, and the…",
      opts:["Paperwork","Programming (avionics/automation)","Parking","Price of fuel"], correct:1,
      why:"The 5P model — Plan, Plane, Pilot, Passengers, Programming — is a recurring in-flight risk review, prompting checks at key decision points rather than only before departure." },

    /* ---- History & general knowledge ---- */
    { cat:"History", q:"The first sustained, controlled powered flight took place in 1903 at Kitty Hawk, flown by…",
      opts:["Glenn Curtiss","The Wright brothers","Louis Blériot","Santos-Dumont"], correct:1,
      why:"On 17 December 1903, Orville and Wilbur Wright flew the Wright Flyer at Kill Devil Hills near Kitty Hawk, North Carolina — the birth of powered aviation." },
    { cat:"History", q:"The pilot who first broke the sound barrier in level flight (1947, in the Bell X-1) was…",
      opts:["Chuck Yeager","Neil Armstrong","Charles Lindbergh","Scott Crossfield"], correct:0,
      why:"On 14 October 1947 Chuck Yeager flew the rocket-powered Bell X-1 “Glamorous Glennis” past Mach 1 over the Mojave — the first confirmed supersonic flight." },
    { cat:"History", q:"An aircraft's “black box” flight recorders are actually painted…",
      opts:["Black","Bright orange","Green","White"], correct:1,
      why:"They're a high-visibility orange (“International Orange”) to aid recovery after a crash. The “black box” nickname stuck for other reasons entirely." },
    { cat:"History", q:"Charles Lindbergh's famous 1927 solo nonstop flight, in the Spirit of St. Louis, crossed the…",
      opts:["Pacific Ocean","Atlantic Ocean (New York to Paris)","English Channel","Sahara Desert"], correct:1,
      why:"Lindbergh flew ~3,600 miles solo and nonstop from New York to Paris in 33.5 hours, electrifying the world and accelerating public faith in aviation." },
    { cat:"History", q:"The boundary often cited as the “edge of space,” about 100 km up, is called the…",
      opts:["Tropopause","Kármán line","Jet stream","Mesosphere"], correct:1,
      why:"The Kármán line at roughly 100 km (62 mi) is a common definition of where aeronautics ends and astronautics begins, as aerodynamic flight becomes impractical." },
    { cat:"History", q:"The 1944 international agreement that created ICAO and still shapes global aviation rules is the…",
      opts:["Warsaw Convention","Chicago Convention","Treaty of Versailles","Bretton Woods Accord"], correct:1,
      why:"The Convention on International Civil Aviation, signed in Chicago in 1944, established the International Civil Aviation Organization and the framework for international air law." },
    { cat:"History", q:"The world's first commercial jet airliner to enter service (1952) was the…",
      opts:["Boeing 707","de Havilland Comet","Douglas DC-8","Sud Aviation Caravelle"], correct:1,
      why:"The de Havilland Comet began jet airline service in 1952; early fatal structural failures traced to metal fatigue at the window corners reshaped how aircraft are designed and tested." },

    /* ---- Physics ---- */
    { cat:"Physics", q:"At standard sea-level conditions, the speed of sound (Mach 1) is approximately…",
      opts:["Half the speed of light","About 661 knots (761 mph)","About 100 knots","Exactly 1,000 mph"], correct:1,
      why:"At 15°C sea level, sound travels about 661 knots / 761 mph / 340 m/s. It falls with temperature, so the speed of sound decreases as an aircraft climbs into colder air." },
    { cat:"Physics", q:"Standard atmospheric pressure at sea level is about…",
      opts:["1013 hPa (29.92 inHg)","500 hPa","2000 hPa","760 hPa"], correct:0,
      why:"The ISA sea-level pressure is 1013.25 hPa, equal to 29.92 inHg or 14.7 psi — the reference for altimetry and performance." },
    { cat:"Physics", q:"The local speed of sound in the atmosphere primarily depends on the air's…",
      opts:["Pressure","Temperature","Humidity","Color"], correct:1,
      why:"Sound speed varies with the square root of absolute temperature, so it drops with altitude as the air cools — which is why Mach number (not indicated speed) governs high-altitude flight." },
    { cat:"Weather", q:"Relative humidity reaches 100% when the air…",
      opts:["Is completely dry","Is holding all the water vapor it can at that temperature (saturated)","Is warmer than the dewpoint by 10°","Contains no oxygen"], correct:1,
      why:"At 100% relative humidity the air is saturated — temperature equals dewpoint — and any further cooling forces condensation into cloud, fog, dew or precipitation." },
    { cat:"Emergencies", q:"A pilot facing unlawful interference (a hijacking) would set transponder code…",
      opts:["7500","7600","7700","1200"], correct:0,
      why:"7500 silently alerts ATC to unlawful interference (hijack); 7600 is lost communications and 7700 is a general emergency. The phrase “fifteen hundred hours I was hijacked” helps some recall 7500 = hijack." },

    { cat:"Aerodynamics", q:"Winglets on a wingtip improve efficiency mainly by…",
      opts:["Adding thrust","Weakening the wingtip vortex and reducing induced drag","Increasing the wing's weight","Raising the never-exceed speed"], correct:1,
      why:"By blocking the high-to-low pressure flow that curls around the tip, winglets shrink the trailing vortex and its induced drag — saving fuel, especially on long-range jets." },
    { cat:"Control", q:"The rudder controls the aircraft's movement about which axis?",
      opts:["The longitudinal (roll) axis","The lateral (pitch) axis","The vertical (yaw) axis","No axis — it only assists brakes"], correct:2,
      why:"The rudder yaws the nose left and right about the vertical (normal) axis. Ailerons roll about the longitudinal axis; the elevator pitches about the lateral axis." },
    { cat:"Flight Mechanics", q:"An aircraft's three axes of rotation, all passing through the center of gravity, are the longitudinal, the lateral, and the…",
      opts:["Diagonal axis","Vertical (normal) axis","Chord axis","Thrust axis"], correct:1,
      why:"Roll is about the longitudinal axis, pitch about the lateral axis, and yaw about the vertical axis — all intersecting at the CG, the point the aircraft rotates around." },
    { cat:"Control", q:"A trim tab is used to…",
      opts:["Increase the maximum speed","Relieve the steady control-column pressure a pilot would otherwise hold","Lock the controls on the ground","Extend the flaps"], correct:1,
      why:"Trim tabs hold a control surface at the needed deflection so the pilot doesn't have to maintain constant pressure — letting the aircraft fly hands-off at a chosen attitude/speed." },
    { cat:"Flight Mechanics", q:"A forward slip is used on approach to…",
      opts:["Gain airspeed quickly","Lose altitude steeply without gaining airspeed","Reduce the descent rate","Increase lift"], correct:1,
      why:"Cross-controlling (aileron one way, opposite rudder) presents the fuselage to the airflow, adding drag so the aircraft descends steeply at a controlled speed — handy to lose height over an obstacle or without flaps." },
    { cat:"Systems", q:"Pre-ignition in a piston engine is…",
      opts:["The normal spark timing","The fuel/air charge igniting before the spark, usually from a glowing hot spot","A cold-start condition","The same thing as leaning"], correct:1,
      why:"A hot spot (a glowing deposit or overheated plug) lights the mixture too early, fighting the piston's rise. Like detonation it can quickly destroy an engine, and the two often accompany each other." },
    { cat:"Operations", q:"During a go-around (balked landing), the pilot's first action should be to…",
      opts:["Retract the flaps fully at once","Apply power and establish a climb attitude","Lower the landing gear","Turn crosswind immediately"], correct:1,
      why:"Power first to arrest the descent and establish a positive climb, then retract flaps and gear in stages. Dumping all the flaps first can cause a sudden sink at low altitude." },
    { cat:"Operations", q:"To avoid wake turbulence when landing behind a heavy jet, a pilot should stay…",
      opts:["Below its glidepath and land before its touchdown point","At or above its flight path and land beyond its touchdown point","Directly on its exact path","As fast as possible"], correct:1,
      why:"Vortices sink and drift, so staying above the heavy's path and touching down beyond its touchdown point keeps you clear of the descending, rolling wake." },
    { cat:"Airports", q:"At a towered airport, the solid yellow runway holding-position (hold-short) lines mean a pilot must…",
      opts:["Cross without stopping","Not cross onto the runway without an ATC clearance","Turn around","Increase taxi speed"], correct:1,
      why:"You hold on the solid-line side until cleared; crossing the hold-short markings onto an active runway without clearance is a runway incursion — a serious and common safety violation." },
    { cat:"Performance", q:"A typical “normal category” general-aviation airplane has a positive limit load factor of about…",
      opts:["+1.5 G","+3.8 G","+6.0 G","+10 G"], correct:1,
      why:"Normal category is certified to +3.8 G (−1.52 G). Utility category allows +4.4 G and aerobatic category +6.0 G — exceeding the limit risks permanent structural damage." },

    /* ================= EXPANSION TO 250 ================= */

    /* ---- Radiotelephony ---- */
    { cat:"Radiotelephony", q:"In the ICAO/NATO phonetic alphabet, the letter “R” is spoken as…",
      opts:["Roger","Romeo","Radio","Robert"], correct:1,
      why:"“Romeo” is the phonetic for R. (“Roger” is a separate procedural word meaning a transmission was received — not a letter.)" },
    { cat:"Radiotelephony", q:"Over the radio, the word “Roger” means…",
      opts:["Yes, I agree","I have received all of your last transmission","I will comply with your instruction","Please repeat"], correct:1,
      why:"“Roger” only acknowledges receipt — “I got it all.” It is NOT a “yes,” and it does not promise compliance; that's “Wilco.”" },
    { cat:"Radiotelephony", q:"A pilot replies “Wilco.” This means…",
      opts:["Please say again","Received, and I will comply","Standby","Negative"], correct:1,
      why:"“Wilco” = “will comply” — it both acknowledges the message and confirms the pilot will carry out the instruction." },
    { cat:"Radiotelephony", q:"To ask a controller or station to repeat their last transmission, the correct phrase is…",
      opts:["“Repeat”","“Say again”","“Come back”","“Rerun”"], correct:1,
      why:"“Say again” requests a repeat. “Repeat” is avoided because in combined operations it can be a call for artillery fire — aviation uses “say again.”" },
    { cat:"Radiotelephony", q:"The spoken distress call indicating grave and imminent danger is…",
      opts:["“Pan-Pan” (three times)","“Mayday” (three times)","“Securité”","“Standby”"], correct:1,
      why:"“Mayday, Mayday, Mayday” declares distress — a life-threatening emergency. “Pan-Pan” (three times) signals urgency: a serious situation that is not yet an immediate threat to life." },

    /* ---- ATP-specific: high-altitude, transport & IFR ---- */
    { cat:"High-Altitude", q:"RVSM airspace reduces the vertical separation between suitably equipped aircraft to 1,000 ft between…",
      opts:["FL180 and FL240","FL290 and FL410","FL410 and FL600","The surface and FL180"], correct:1,
      why:"Reduced Vertical Separation Minimum applies 1,000-ft separation (instead of 2,000) from FL290 to FL410, adding usable cruising levels in busy high-altitude airspace." },
    { cat:"High-Altitude", q:"In the United States, pilots set the altimeter to 29.92 and use flight levels at and above…",
      opts:["10,000 ft","14,000 ft","18,000 ft (FL180)","24,000 ft"], correct:2,
      why:"18,000 ft MSL is the U.S. transition altitude and the floor of Class A; at and above it everyone references standard pressure (29.92) and reports flight levels." },
    { cat:"High-Altitude", q:"On a jet's airspeed indicator, the “barber pole” marks…",
      opts:["The stall speed","VMO/MMO — the maximum operating airspeed/Mach","Best-glide speed","The flap limit"], correct:1,
      why:"The striped barber-pole needle shows VMO (a speed limit low down) transitioning to MMO (a Mach limit up high); exceeding it risks overspeed, buffet and structural loads." },
    { cat:"Transport", q:"A “stabilized approach” for an airliner generally requires the aircraft to be configured, on speed and on path by…",
      opts:["The final flare","1,000 ft above the airport in IMC (500 ft in VMC)","The middle marker only","Touchdown"], correct:1,
      why:"If not stabilized by the gate (typically 1,000 ft AGL in IMC, 500 ft VMC), the required action is a go-around — unstabilized approaches are a leading cause of landing accidents." },
    { cat:"Transport", q:"A Category III ILS approach is distinguished by…",
      opts:["Higher weather minimums than Cat I","Very low or zero visibility minimums, typically using autoland","Use only in visual conditions","No need for a glideslope"], correct:1,
      why:"Cat II and especially Cat III approaches permit landings in very low visibility using precise, redundant equipment and usually autoland — with aircraft, crew and airport all specially certified." },
    { cat:"IFR", q:"On an instrument approach, a Decision Height (DH) rather than a Minimum Descent Altitude (MDA) is used on a…",
      opts:["Non-precision approach","Precision (or approach with vertical guidance) approach","Visual approach","Circling approach"], correct:1,
      why:"A DH belongs to precision/vertical-guidance approaches (ILS, LPV): at the DH you decide to land or go around. Non-precision approaches use an MDA you must not descend below until the landing is assured." },
    { cat:"Transport", q:"An airliner's landing reference speed, VREF, is approximately…",
      opts:["1.0 × the landing-configuration stall speed","1.3 × the landing-configuration stall speed (VSO)","2.0 × VSO","Equal to VNE"], correct:1,
      why:"VREF is set near 1.3 × VSO to give a safe margin above the stall over the threshold, then adjusted for wind and gust factors on the approach." },
    { cat:"Transport", q:"V2, computed for a transport takeoff, is the…",
      opts:["Speed to begin the takeoff roll","Takeoff safety speed — the minimum climb speed to hold after an engine failure","Maximum tire speed","Speed to retract the gear"], correct:1,
      why:"V2 is the target climb speed with an engine failed at or after V1, giving the required climb gradient until a safe height, where the aircraft accelerates and cleans up." },
    { cat:"Transport", q:"“Accelerate-stop distance” is the runway length needed to…",
      opts:["Take off and climb to 1,500 ft","Accelerate to V1, then reject the takeoff and stop","Land and taxi clear","Accelerate to cruise speed"], correct:1,
      why:"It's the distance to accelerate to the decision speed V1 and then bring the aircraft to a stop if the takeoff is rejected — a key number in a rejected-takeoff (RTO) decision." },
    { cat:"Transport", q:"If a TCAS Resolution Advisory (RA) conflicts with an ATC instruction, the crew must…",
      opts:["Follow the ATC instruction","Follow the RA and advise ATC","Ignore both and maintain heading","Descend immediately regardless"], correct:1,
      why:"A TCAS RA is followed even against ATC, because both conflicting aircraft's systems coordinate the maneuver; the crew promptly tells ATC they are responding to an RA." },
    { cat:"Transport", q:"An EGPWS/TAWS aural “PULL UP” warning tells the crew that…",
      opts:["The engines are overspeeding","The aircraft is dangerously close to terrain and must climb immediately","The cabin is depressurizing","The gear is unsafe"], correct:1,
      why:"Terrain Awareness and Warning Systems compare position to a terrain database and command an immediate max-performance climb to prevent controlled flight into terrain (CFIT)." },
    { cat:"Transport", q:"A stick shaker and a stick pusher differ in that the shaker…",
      opts:["Pushes the nose down at the stall","Warns of an approaching stall, while the pusher actively lowers the nose","Retracts the flaps","Is only used on the ground"], correct:1,
      why:"The stick shaker vibrates the yoke to warn of an impending stall; if angle of attack keeps rising, the stick pusher physically forces the nose down to prevent the stall." },
    { cat:"Transport", q:"A yaw damper is fitted to many swept-wing jets primarily to…",
      opts:["Increase cruise speed","Automatically counter Dutch roll","Steer on the ground","Reduce fuel burn"], correct:1,
      why:"Swept-wing jets are prone to Dutch roll; the yaw damper applies small automatic rudder inputs to suppress the oscillation and smooth the ride." },
    { cat:"Transport", q:"On a pressurized airliner, a cabin-altitude warning horn typically sounds when the cabin altitude climbs through about…",
      opts:["5,000 ft","10,000 ft","25,000 ft","40,000 ft"], correct:1,
      why:"A cabin altitude of roughly 10,000 ft triggers the warning, prompting the crew to don oxygen masks, begin an emergency descent, and troubleshoot the pressurization." },
    { cat:"Transport", q:"After an engine failure at high altitude, a twin's “drift-down” procedure means the aircraft…",
      opts:["Dives rapidly to the ground","Descends gradually to an altitude it can maintain on the remaining engine","Holds its cruise altitude indefinitely","Jettisons fuel and lands immediately"], correct:1,
      why:"With reduced thrust the aircraft can no longer hold cruise level, so it drifts down to its single-engine ceiling — a driving concern in ETOPS terrain and route planning." },
    /* ---- Aerodynamics & flight mechanics ---- */
    { cat:"Aerodynamics", q:"Compared with plain or split flaps, Fowler flaps produce the most lift because they…",
      opts:["Only deflect downward","Slide aft AND down, increasing both wing area and camber","Reduce the wing area","Act as spoilers"], correct:1,
      why:"Fowler flaps extend rearward on tracks before deflecting down, adding area first (more lift) and then camber (still more lift) — hence their use on most airliners." },
    { cat:"Aerodynamics", q:"Spoilers (speed brakes) deployed on the upper wing surface…",
      opts:["Increase lift","Reduce lift and increase drag","Increase thrust","Lower the stall speed"], correct:1,
      why:"Spoilers disrupt airflow to dump lift and add drag — used to descend steeply, slow down, or (as ground spoilers) plant the aircraft on the runway for braking." },
    { cat:"Aerodynamics", q:"Frise ailerons are shaped to help counter…",
      opts:["Mach tuck","Adverse yaw","Ground effect","Wing icing"], correct:1,
      why:"On a Frise aileron the up-going surface projects its leading edge into the airflow, adding drag on that side to offset the extra drag of the down-going aileron — reducing adverse yaw." },
    { cat:"Flight Mechanics", q:"A canard is…",
      opts:["A rear-mounted tail","A small horizontal surface mounted ahead of the main wing","A type of landing gear","A wingtip fuel tank"], correct:1,
      why:"A canard is a foreplane ahead of the wing; it can provide pitch control and lift, and is often designed to stall before the main wing for stall resistance." },
    { cat:"Flight Mechanics", q:"As angle of attack increases, the coefficient of lift…",
      opts:["Rises without limit","Rises to a maximum at the critical angle, then drops sharply as the wing stalls","Stays constant","Falls immediately"], correct:1,
      why:"CL climbs with AoA up to the critical angle (CLmax), then collapses as the airflow separates — the very definition of the stall, independent of airspeed." },

    /* ---- Weather ---- */
    { cat:"Weather", q:"In the Northern Hemisphere, the Coriolis effect deflects moving air to the…",
      opts:["Left","Right","Straight up","Straight down"], correct:1,
      why:"Earth's rotation deflects freely moving air to the right in the Northern Hemisphere, shaping the clockwise flow around highs and counter-clockwise flow around lows." },
    { cat:"Weather", q:"Around a high-pressure system in the Northern Hemisphere, surface winds tend to flow…",
      opts:["Counter-clockwise and inward, with rising air","Clockwise and outward, with sinking air and generally fair weather","Straight toward the center","Only vertically"], correct:1,
      why:"Highs are anticyclonic: clockwise, outward flow with descending, drying air — usually fair skies. Lows are the reverse: inward, rising, cloud- and precipitation-forming air." },
    { cat:"Weather", q:"On a surface chart, tightly packed isobars indicate…",
      opts:["Light winds","Strong winds","No wind","Warm temperatures"], correct:1,
      why:"Closely spaced isobars mean a steep pressure gradient, which drives stronger winds; widely spaced isobars indicate a gentle gradient and lighter winds." },
    { cat:"Weather", q:"The Intertropical Convergence Zone (ITCZ) is…",
      opts:["A band of thunderstorms and heavy convection near the equator","A polar high-pressure area","A jet stream over the poles","A desert wind"], correct:0,
      why:"Where the hemispheres' trade winds converge near the equator, air rises to form a shifting belt of towering cumulus and thunderstorms — a major hazard on tropical routes." },
    { cat:"Weather", q:"Frost on the wings before takeoff is hazardous because it…",
      opts:["Adds useful weight","Disrupts airflow over the wing, spoiling lift and raising stall speed","Improves lift","Only affects the paint"], correct:1,
      why:"Even a thin layer of frost roughens the wing enough to disturb the boundary layer, cutting lift and raising stall speed — it must be completely removed before flight." },
    { cat:"Weather", q:"“Steam fog” (sea smoke) forms when…",
      opts:["Warm air moves over a cold surface","Cold air moves over a warmer body of water","Rain falls through dry air","The air is perfectly still and warm"], correct:1,
      why:"Cold air flowing over relatively warm water picks up moisture that immediately condenses, producing wisps of fog rising like steam from the surface." },

    /* ---- Navigation & instruments ---- */
    { cat:"Navigation", q:"A knot is a speed of…",
      opts:["One statute mile per hour","One nautical mile per hour","One kilometre per minute","One nautical mile per minute"], correct:1,
      why:"A knot is one nautical mile per hour. Since a minute of latitude is one nautical mile, knots tie neatly to chart distances." },
    { cat:"Navigation", q:"The correct order to convert a true course to a compass heading is…",
      opts:["True → Deviation → Magnetic → Variation → Compass","True → Variation → Magnetic → Deviation → Compass","Compass → Magnetic → True","Magnetic → True → Compass"], correct:1,
      why:"“TVMDC” — True, apply Variation to get Magnetic, apply Deviation to get Compass. A common mnemonic is “True Virgins Make Dull Company.”" },
    { cat:"Navigation", q:"Aviation uses Coordinated Universal Time (UTC, “Zulu”) because it…",
      opts:["Is always local noon","Avoids confusion across time zones with a single worldwide reference","Runs faster than local time","Only applies at the equator"], correct:1,
      why:"Flights cross many zones, so ATC, flight plans and weather all use one clock — UTC/Zulu — to keep timing unambiguous everywhere." },
    { cat:"Instruments", q:"A Horizontal Situation Indicator (HSI) is useful because it combines…",
      opts:["Airspeed and altitude","The heading indicator with VOR/ILS course guidance","Engine RPM and manifold pressure","Fuel and oil readings"], correct:1,
      why:"The HSI overlays course deviation and glideslope onto a slaved heading display, giving an intuitive top-down picture of the aircraft relative to the selected course." },
    { cat:"Instruments", q:"WAAS augments GPS mainly by…",
      opts:["Adding more satellites","Improving accuracy and integrity enough for vertical (LPV) approach guidance","Providing weather radar","Replacing the altimeter"], correct:1,
      why:"The Wide Area Augmentation System sends correction data that sharpens GPS accuracy and reliability, enabling approaches with glidepath guidance down to near-ILS minimums." },

    /* ---- Systems ---- */
    { cat:"Systems", q:"Besides lubrication, a major job of an aircraft engine's oil is to…",
      opts:["Ignite the fuel","Carry away heat (cooling)","Charge the battery","Inflate the tires"], correct:1,
      why:"Oil lubricates, cleans, seals and — crucially — cools, carrying heat from the pistons and bearings to the oil cooler. Low oil quantity or pressure quickly threatens the engine." },
    { cat:"Systems", q:"Tricycle landing gear (a nosewheel) is generally more forgiving than a taildragger because it…",
      opts:["Is lighter","Places the CG ahead of the mains, making the aircraft directionally stable on the ground","Needs no brakes","Cannot ground-loop ever"], correct:1,
      why:"With the CG forward of the main wheels, a tricycle-gear aircraft tends to track straight, whereas a taildragger's aft CG makes it prone to swinging (ground loops)." },
    { cat:"Systems", q:"Dual magnetos and two spark plugs per cylinder provide redundancy and also…",
      opts:["Reduce the engine's weight","More complete, efficient combustion (a slight power gain)","Cooler oil","Automatic mixture control"], correct:1,
      why:"Two spark sources light the charge from two points, burning it more completely for a small power and efficiency gain — plus the safety of a backup ignition path." },
    { cat:"Systems", q:"Fuel-injected piston engines are less prone than carbureted ones to…",
      opts:["Detonation","Induction (carburetor) icing","Oil leaks","Magneto failure"], correct:1,
      why:"Injecting fuel directly at the cylinders avoids the venturi temperature drop that causes carburetor icing — one reason many engines moved to fuel injection." },

    /* ---- Airspace, regs & airports ---- */
    { cat:"Airspace / Regs", q:"A Military Operations Area (MOA) is established to…",
      opts:["Prohibit all civilian flight permanently","Separate military training activity from IFR traffic (VFR may transit with caution)","Mark an airport traffic pattern","Designate a fuel stop"], correct:1,
      why:"MOAs contain military maneuvers; ATC keeps IFR traffic clear or advises it, and VFR pilots may legally transit but should check whether the MOA is active and stay alert." },
    { cat:"Airspace / Regs", q:"A Prohibited Area (such as P-56 over the U.S. Capitol and White House) means…",
      opts:["Flight is allowed with a transponder","Flight is entirely forbidden within its boundaries","VFR is fine below 1,000 ft","Only military jets may enter"], correct:1,
      why:"Prohibited areas ban flight altogether for security or national-welfare reasons. Restricted areas, by contrast, may sometimes be transited when not active, with permission." },
    { cat:"Airspace / Regs", q:"In the U.S., Class E airspace generally extends upward to, but does not include…",
      opts:["10,000 ft MSL","14,500 ft MSL","18,000 ft MSL (the base of Class A)","60,000 ft"], correct:2,
      why:"Class E fills much of the controlled airspace up to 18,000 ft MSL, where Class A begins. Its floor varies — often 700 or 1,200 ft AGL, or the surface near some airports." },
    { cat:"Airports", q:"A rotating airport beacon alternating white and green identifies…",
      opts:["A military airport","A lighted civilian land airport","A heliport","A restricted area"], correct:1,
      why:"White-and-green identifies a lighted civil land airport. A military airport alternates white-white-green (a dual white flash); other colors mark water airports and heliports." },
    { cat:"Airports", q:"On the airport surface, a red sign with white lettering is…",
      opts:["A direction sign","A mandatory instruction sign (e.g., a runway hold position)","A distance-remaining sign","A taxiway location sign"], correct:1,
      why:"Red mandatory signs mark holding positions and boundaries you may not cross without clearance. Black-with-yellow are location signs; yellow-with-black are direction/destination signs." },

    /* ---- Operations, physiology & human factors ---- */
    { cat:"Operations", q:"A windsock at an airport tells a pilot the…",
      opts:["Runway length","Wind direction and rough speed, so they can take off and land into the wind","Airport elevation","Radio frequency"], correct:1,
      why:"The sock streams away from the wind and stiffens as it strengthens. Pilots take off and land into the wind for the lowest groundspeed and shortest ground roll." },
    { cat:"Operations", q:"To carry passengers, a pilot must have completed, within the preceding 90 days,…",
      opts:["A flight review","Three takeoffs and landings","An instrument approach","A medical exam"], correct:1,
      why:"Passenger-carrying recency requires three takeoffs and landings in the last 90 days (in the same category/class); night passenger currency requires them to a full stop at night." },
    { cat:"Physiology", q:"U.S. “bottle-to-throttle” rules prohibit acting as a crewmember within ______ of consuming alcohol, or with a blood-alcohol level at or above 0.04%.",
      opts:["1 hour","8 hours","30 minutes","24 hours"], correct:1,
      why:"At least 8 hours must pass from “bottle to throttle,” and the pilot must be below 0.04% BAC and not under the influence — and hangover effects can impair well beyond 8 hours." },
    { cat:"Physiology", q:"A painful ear or sinus “block” is most likely to occur during…",
      opts:["A climb","A descent, as outside pressure increases","Straight-and-level cruise","Engine start"], correct:1,
      why:"On descent, rising ambient pressure must be equalized into the ears and sinuses; congestion can trap lower pressure inside, causing pain or even damage — worse with a cold." },
    { cat:"Human Factors", q:"Crew (or Cockpit) Resource Management, CRM, is best described as…",
      opts:["A fuel-planning method","The effective use of all available resources — people, equipment and information — for safe, efficient flight","A type of autopilot","An engine-monitoring system"], correct:1,
      why:"CRM turns communication, leadership, workload management and decision-making into deliberate skills, breaking the error chains that once caused otherwise avoidable accidents." },

    /* ================= EXPANSION TO 300 ================= */

    /* ---- Aerodynamics & flight mechanics ---- */
    { cat:"Aerodynamics", q:"Bernoulli's principle, as applied to a wing, states that where the airflow speeds up, its…",
      opts:["Static pressure rises","Static pressure falls","Temperature rises sharply","Density doubles"], correct:1,
      why:"Faster-moving air over the curved upper surface has lower static pressure; the higher pressure beneath then contributes to lift. (Downwash and Newton's third law explain the rest.)" },
    { cat:"Aerodynamics", q:"Parasite drag grows with the square of airspeed while induced drag falls with speed, so total drag is at a minimum at…",
      opts:["The stall speed","The speed for best lift-to-drag ratio (L/Dmax)","The never-exceed speed","Full power"], correct:1,
      why:"Where the two drag curves cross — L/Dmax — total drag is least and range/glide is greatest; this is the basis of best-glide and maximum-endurance speeds." },
    { cat:"Control", q:"The horizontal stabilizer (tailplane) chiefly provides an aircraft's…",
      opts:["Directional (yaw) stability","Longitudinal (pitch) stability","Lateral (roll) stability","Cabin pressurization"], correct:1,
      why:"The tailplane resists pitch changes, keeping the nose steady — longitudinal stability. The vertical fin handles yaw; dihedral handles roll." },
    { cat:"Control", q:"The vertical fin provides an aircraft's…",
      opts:["Pitch stability","Directional (yaw) stability, weathervaning the nose into the relative wind","Roll stability","Lift"], correct:1,
      why:"Like a weathervane, the fin keeps the nose pointed into the relative wind, damping yaw excursions — directional (weathercock) stability." },
    { cat:"Flight Mechanics", q:"On a conventionally stable airplane, the center of gravity is located…",
      opts:["Behind the center of lift, so the tail lifts up","Ahead of the center of lift, so the tail carries a download","Exactly at the center of lift","At the wingtip"], correct:1,
      why:"With the CG ahead of the lift, the nose wants to drop; a tail download balances it. This arrangement makes the aircraft pitch-stable and gives stall recovery its natural nose-down tendency." },
    { cat:"Flight Mechanics", q:"The “boundary layer” is…",
      opts:["The line between two air masses","The thin layer of air, slowed by friction, right next to the aircraft's surface","The top of the troposphere","The edge of controlled airspace"], correct:1,
      why:"Skin friction slows the air immediately adjacent to the surface; managing this boundary layer (with vortex generators, slots, etc.) delays separation and stall." },
    { cat:"Flight Mechanics", q:"Small “stall strips” on a wing's leading edge are fitted to…",
      opts:["Increase top speed","Trigger the wing root to stall before the tips, preserving aileron control","Reduce fuel burn","Prevent icing"], correct:1,
      why:"By forcing an early, clean root stall, stall strips keep airflow attached at the ailerons and give a recognizable straight-ahead stall break rather than a wing drop." },
    { cat:"Flight Mechanics", q:"“Aileron reversal” at very high speed occurs when…",
      opts:["The ailerons freeze","Aerodynamic loads twist a flexible wing, reversing the intended roll","The autopilot disconnects","The flaps deploy"], correct:1,
      why:"At high dynamic pressure, a down-going aileron can twist the wing enough to reduce its angle of attack, so the aircraft rolls opposite to the input — an aeroelastic limit on some designs." },

    /* ---- Weather ---- */
    { cat:"Weather", q:"Cirrus clouds are…",
      opts:["Low, grey layered clouds","High, wispy clouds made of ice crystals","Towering thunderstorm clouds","Ground-hugging fog"], correct:1,
      why:"Cirrus form high in the troposphere from ice crystals; thickening, lowering cirrus often signals an approaching warm front and deteriorating weather." },
    { cat:"Weather", q:"Which pairing is correct?",
      opts:["Stratus = puffy heaps; cumulus = flat layers","Stratus = flat layers; cumulus = puffy heaps","Both are ice clouds only","Both mean fog"], correct:1,
      why:"“Stratus” means layered (flat, widespread), while “cumulus” means heaped (puffy). The prefixes/suffixes (nimbo-, alto-, -nimbus) then add height and precipitation." },
    { cat:"Weather", q:"A PIREP is…",
      opts:["A pre-flight inspection report","A pilot report of actual conditions encountered in flight","A type of approach","A runway marking"], correct:1,
      why:"Pilot reports relay real, observed conditions — turbulence, icing, cloud tops, ride quality — filling the gaps between forecasts and ground observations for other pilots." },
    { cat:"Weather", q:"Wind shear is…",
      opts:["A steady crosswind","A sudden change in wind speed and/or direction over a short distance","A type of fog","Air that is perfectly smooth"], correct:1,
      why:"Rapid changes in the wind — vertically or horizontally — can abruptly alter airspeed and lift. Low-level wind shear on approach or departure is especially dangerous." },
    { cat:"Weather", q:"Compared with warm air, cold air is…",
      opts:["Less dense and rises","More dense and sinks","Identical in density","Always moister"], correct:1,
      why:"Cold air is denser and tends to sink, while warm air rises — the engine behind convection, sea breezes, thunderstorms and frontal lifting." },
    { cat:"Weather", q:"Frost forms on an aircraft when a surface cools…",
      opts:["Above the dewpoint","Below the dewpoint and below freezing, so water vapor deposits directly as ice","Only in rain","Only at high altitude"], correct:1,
      why:"When the skin drops below both the dewpoint and 0°C, vapor deposits as frost. Even a thin layer must be removed — it roughens the wing and spoils lift." },
    { cat:"Weather", q:"A chinook (foehn) wind is…",
      opts:["A cold, wet sea wind","A warm, dry wind descending the lee side of a mountain range","A polar easterly","A type of thunderstorm"], correct:1,
      why:"As air descends a mountain's lee side it compresses and warms, arriving warm and dry — chinooks can raise temperatures dramatically and rapidly melt snow." },
    { cat:"Weather", q:"Hail grows inside a thunderstorm by…",
      opts:["Freezing on the ground","Being cycled up and down through the cell, accreting layers of ice","Falling straight down once","Forming in clear air"], correct:1,
      why:"Strong updrafts carry water drops high where they freeze and collect more ice on each trip up and down, until they grow too heavy for the updraft and fall — sometimes ejected miles from the cell." },
    { cat:"Weather", q:"An altimeter set to QFE (rather than QNH) reads…",
      opts:["Altitude above mean sea level","Height above the airfield (zero on the ground)","Pressure altitude","Density altitude"], correct:1,
      why:"QFE references field-level pressure so the altimeter reads height above the field (zero on the runway); QNH references sea level so it reads altitude above MSL." },

    /* ---- Navigation & instruments ---- */
    { cat:"Navigation", q:"A rhumb line is a route flown at a…",
      opts:["Constant compass heading","Constantly changing heading","Constant altitude only","Right angle to the wind"], correct:0,
      why:"A rhumb line crosses every meridian at the same angle — a constant heading. It's longer than a great circle but simpler to steer, which mattered before modern navigation." },
    { cat:"Navigation", q:"Lines of longitude (meridians)…",
      opts:["Are parallel everywhere","Converge at the poles and are widest at the equator; 0° passes through Greenwich","Measure north–south position","Never meet"], correct:1,
      why:"Meridians run pole to pole, converging at the poles; the Prime Meridian (0° longitude) runs through Greenwich, England, and is the reference for longitude and time." },
    { cat:"Navigation", q:"A VOR's “TO/FROM” indicator tells the pilot…",
      opts:["The wind direction","Whether the selected course would take the aircraft to or away from the station","The aircraft's altitude","The distance remaining"], correct:1,
      why:"TO/FROM resolves the ambiguity of a radial: the same course line can lead toward or away from the VOR, and the flag shows which — independent of the aircraft's heading." },
    { cat:"Instruments", q:"The needle (course deviation indicator) on a VOR/ILS display shows…",
      opts:["The aircraft's airspeed","How far left or right of the selected course the aircraft is","Engine RPM","The outside temperature"], correct:1,
      why:"The CDI needle deflects toward the course: center means on course, and full-scale deflection means the aircraft is off to one side (a few degrees on a VOR, less on a localizer)." },

    /* ---- Airspace, regs, airports & operations ---- */
    { cat:"Airspace / Regs", q:"On a VFR sectional chart, Class B airspace is depicted by…",
      opts:["Solid magenta lines","Solid blue lines","Dashed magenta lines","A magenta shaded band"], correct:1,
      why:"Class B is solid blue, Class C solid magenta, Class D dashed blue, and Class E surface areas dashed magenta — with magenta/blue fades marking Class E floors of 700/1,200 ft AGL." },
    { cat:"Airspace / Regs", q:"Before any flight, FAR 91.103 requires the pilot to become familiar with…",
      opts:["Only the destination weather","All available information — weather, fuel needs, alternatives, and runway/performance data","Just the aircraft registration","Nothing, if VFR"], correct:1,
      why:"“All available information concerning that flight” includes weather, fuel requirements, alternatives if the flight can't be completed, known traffic delays, and runway lengths and takeoff/landing distances." },
    { cat:"Airspace / Regs", q:"A standard-category aircraft must have an annual inspection every…",
      opts:["6 calendar months","12 calendar months (plus a 100-hour inspection if used for hire)","24 calendar months","50 flight hours"], correct:1,
      why:"An annual is required every 12 calendar months; aircraft carrying persons for hire or used for flight instruction for hire also need a 100-hour inspection." },
    { cat:"Airspace / Regs", q:"A “Warning Area” differs from a Restricted Area in that it…",
      opts:["Is always over land","Begins 3 nm out over international/coastal waters, where the U.S. can't legally 'restrict'","Prohibits all flight forever","Is only for balloons"], correct:1,
      why:"Warning Areas extend from 3 nm outward over water and contain activity hazardous to aircraft; because it's international airspace, the label 'warning' is used instead of 'restricted.'" },
    { cat:"Airspace / Regs", q:"VFR above 10,000 ft MSL (and more than 1,200 ft AGL) requires visibility and cloud clearance of…",
      opts:["3 SM; 500 below, 1,000 above, 2,000 horizontal","5 SM; 1,000 below, 1,000 above, 1 SM horizontal","1 SM; clear of clouds","No requirement"], correct:1,
      why:"Higher up, faster traffic needs more room: 5 statute miles visibility with 1,000 ft below/above and 1 statute mile horizontal from clouds — versus the “3-152” rule lower down." },
    { cat:"Airports", q:"Runway End Identifier Lights (REIL) are…",
      opts:["Steady green threshold lights","A pair of synchronized flashing lights marking the runway threshold","Taxiway edge lights","Approach glidepath lights"], correct:1,
      why:"REIL are two synchronized flashing lights either side of the runway threshold, helping a pilot pick out the landing end against a cluttered or poorly lit background." },
    { cat:"Airports", q:"A segmented circle with extended L-shaped legs at a non-towered airport indicates…",
      opts:["The runway is closed","The traffic-pattern direction (e.g., right-hand traffic) for a runway","Fuel is available","The wind is calm"], correct:1,
      why:"The traffic-pattern indicators around a segmented circle show the base-to-final turn direction for each runway, alerting pilots to non-standard (right-hand) patterns." },
    { cat:"Operations", q:"At a non-towered airport, pilots coordinate by self-announcing their position and intentions on the…",
      opts:["Emergency frequency 121.5","CTAF/UNICOM (the common traffic advisory frequency)","Center frequency","Transponder"], correct:1,
      why:"Without a tower, everyone broadcasts on the CTAF (often a UNICOM) to build a shared mental picture of who's where in the pattern and on the runway." },
    { cat:"Operations", q:"A tetrahedron or wind tee at an airfield indicates…",
      opts:["The airport elevation","The direction to land/take off (aligned with the wind)","The radio frequency","The runway length"], correct:1,
      why:"These ground indicators point in the landing direction (into the wind). Note a free-swinging tetrahedron shows wind direction, but it may be locked to show the preferred landing direction." },

    /* ---- Systems ---- */
    { cat:"Systems", q:"A fuel's octane (or grade) rating indicates its…",
      opts:["Energy content","Resistance to detonation","Color","Freezing point"], correct:1,
      why:"Higher octane resists detonation (knock) under high pressure and temperature. Using a lower grade than specified invites destructive detonation — never downgrade fuel." },
    { cat:"Systems", q:"Carburetor heat prevents or clears carb ice by…",
      opts:["Electrically heating the fuel","Routing warm, unfiltered air from a shroud around the exhaust into the carburetor","Injecting alcohol","Increasing RPM automatically"], correct:1,
      why:"Warm air from the exhaust muff melts or prevents ice in the venturi. Because it's unfiltered and less dense, carb heat also causes a slight power loss — expected and normal." },
    { cat:"Systems", q:"Cowl flaps on a piston aircraft are used to…",
      opts:["Trim the aircraft","Control engine cooling airflow — open for climb, closed to retain heat","Deploy in an emergency","Adjust the mixture"], correct:1,
      why:"Open cowl flaps increase cooling airflow during high-power, low-speed climbs; closing them in cruise reduces drag and keeps cylinder temperatures from dropping too far." },
    { cat:"Systems", q:"During the run-up, checking each magneto (the “mag drop”) verifies…",
      opts:["Oil quantity","That each independent ignition system is firing (a small RPM drop is normal)","Tire pressure","Fuel color"], correct:1,
      why:"Switching to each magneto should give a small, roughly even RPM drop. Too large a drop, a rough engine, or no drop at all points to an ignition fault to resolve before flight." },
    { cat:"Systems", q:"On the electrical system, an ammeter showing a positive (charging) reading means…",
      opts:["The battery is discharging","The alternator is supplying the loads and recharging the battery","The alternator has failed","The starter is engaged"], correct:1,
      why:"A positive indication shows the alternator is carrying the electrical load and topping up the battery; a persistent discharge (negative) warns of an alternator or bus problem." },

    /* ---- Physiology ---- */
    { cat:"Physiology", q:"Early signs of hypoxia often include…",
      opts:["Sharpened judgment","Euphoria and impaired judgment, later cyanosis (bluish lips/fingertips)","Improved night vision","Lowered heart rate only"], correct:1,
      why:"Insidiously, hypoxia can bring a false sense of well-being while judgment and coordination degrade; blue-tinged skin (cyanosis) and tunnel vision follow. Night vision suffers first, even at modest altitude." },
    { cat:"Physiology", q:"At around 25,000 ft, a pilot's time of useful consciousness after losing pressurization is roughly…",
      opts:["Over an hour","A few minutes","No limit","One second"], correct:1,
      why:"TUC is only a few minutes at 25,000 ft and mere seconds above 40,000 ft — which is why an immediate emergency descent and oxygen are drilled for rapid decompression." },
    { cat:"Physiology", q:"Sustained positive G-forces in a tight, high-speed maneuver can cause…",
      opts:["Blood to pool in the head","Blood to drain from the head, leading to grey-out and then black-out","No physiological effect","Improved vision"], correct:1,
      why:"Positive G pushes blood toward the feet; as it drains from the eyes and brain the pilot sees grey, then tunnel vision and black-out, and ultimately G-induced loss of consciousness (G-LOC)." },
    { cat:"Physiology", q:"On climb, gas trapped in the stomach and intestines tends to…",
      opts:["Contract painlessly","Expand as pressure drops, causing discomfort","Turn to liquid","Have no effect"], correct:1,
      why:"By Boyle's law, trapped gas expands as ambient pressure falls with altitude, causing abdominal discomfort — worsened by carbonated drinks or gas-producing foods before flight." },

    /* ---- ATP: IFR, transport & multi-engine ---- */
    { cat:"IFR", q:"A precision approach differs from a non-precision approach in that it provides…",
      opts:["Only lateral guidance","Both lateral and vertical (glideslope) guidance","No electronic guidance","Weather information"], correct:1,
      why:"A precision approach (e.g. ILS) gives a glideslope for vertical guidance down to a Decision Altitude; a non-precision approach has only lateral guidance and a Minimum Descent Altitude." },
    { cat:"IFR", q:"If the runway environment isn't in sight at the DA or MDA, the pilot must fly the…",
      opts:["Same approach again immediately","Published missed-approach procedure","Aircraft straight into the ground","Downwind leg"], correct:1,
      why:"Reaching the decision altitude/minimum descent altitude without the required visual references, the pilot executes the charted missed approach — climb, configure, and follow the published track." },
    { cat:"IFR", q:"A SID and a STAR are, respectively…",
      opts:["Two types of stall","A standard instrument departure route and a standard terminal arrival route","Radio codes","Weather products"], correct:1,
      why:"SIDs streamline IFR departures and STARs streamline arrivals, packaging complex clearances into a single named, charted procedure to reduce workload and radio congestion." },
    { cat:"IFR", q:"Under the IFR “1-2-3 rule,” an alternate airport must be filed unless, from 1 hour before to 1 hour after ETA, the ceiling is at least ______ and visibility at least ______.",
      opts:["1,000 ft / 1 SM","2,000 ft / 3 SM","500 ft / 1 SM","5,000 ft / 5 SM"], correct:1,
      why:"If the forecast within ±1 hour of arrival is at least 2,000-ft ceiling and 3 SM visibility, no alternate is required; otherwise you must file one that meets its own weather minimums." },
    { cat:"Transport", q:"Aircraft approach categories (A, B, C, D) are based on…",
      opts:["Maximum takeoff weight","1.3 times the stall speed in the landing configuration (VSO) — i.e., approach speed","Engine count","Wingspan"], correct:1,
      why:"Category speed = 1.3 × VSO at max landing weight: Cat A under 91 kt, B 91–120, C 121–140, D 141–165. Faster categories need larger circling and obstacle areas on approaches." },
    { cat:"Transport", q:"On touchdown, thrust reversers and ground spoilers are deployed to…",
      opts:["Increase lift for a go-around","Decelerate the aircraft and dump lift so the wheels grip for braking","Steer the nosewheel","Pressurize the cabin"], correct:1,
      why:"Ground spoilers spoil the wing's lift so weight settles on the wheels for effective braking, while reversers redirect engine thrust forward — together shortening the landing roll." },
    { cat:"Transport", q:"An anti-skid braking system improves stopping on a slippery runway by…",
      opts:["Locking the wheels firmly","Sensing and preventing wheel lockup to keep tires near maximum grip","Reversing the engines","Adding weight to the wheels"], correct:1,
      why:"Like automotive ABS, anti-skid modulates brake pressure at each wheel to prevent the skidding that both lengthens stopping distance and can blow tires or cause loss of control." },
    { cat:"Transport", q:"Runway braking-action reports use the terms…",
      opts:["Fast, medium, slow","Good, medium, poor (and nil)","Green, amber, red","Dry, damp, flooded only"], correct:1,
      why:"Braking action is reported as good, good-to-medium, medium, medium-to-poor, poor, or nil, letting crews assess a contaminated runway's friction against their performance data." },
    { cat:"Multi-Engine", q:"A twin's published “single-engine service ceiling” is the density altitude at which it can still climb at about…",
      opts:["500 ft/min on one engine","50 ft/min on one engine","1,000 ft/min on one engine","0 ft/min (level only)"], correct:1,
      why:"With one engine out, climb performance is meager; the single-engine service ceiling (≈50 fpm) can be surprisingly low on a hot, high day — a critical number for terrain and go-around planning." },
    { cat:"IFR", q:"“Known icing conditions” for flight-planning purposes generally means…",
      opts:["Any cold day","Visible moisture (cloud or precipitation) at temperatures at or below freezing","Only freezing rain","Frost on the ground"], correct:1,
      why:"Where visible moisture meets freezing temperatures, structural ice can form. Dispatching into forecast known icing without approved anti-/de-ice equipment is prohibited and hazardous." },
    { cat:"Navigation", q:"One nautical mile is approximately…",
      opts:["5,280 feet","6,076 feet","3,281 feet","10,000 feet"], correct:1,
      why:"A nautical mile is about 6,076 feet — roughly 1.15 statute miles (5,280 ft) — because it equals one minute of latitude. Aviation uses nautical miles and knots for exactly this tie to the chart." },

    /* ================= EXPANSION TO 350 ================= */

    /* ---- Aerodynamics, control & flight mechanics ---- */
    { cat:"Aerodynamics", q:"An elliptical lift distribution across the span (famously on the Spitfire) is prized because it…",
      opts:["Increases top speed directly","Produces the least induced drag for a given lift","Eliminates the need for a tail","Prevents all stalls"], correct:1,
      why:"An elliptical spanwise lift distribution generates uniform downwash and the minimum induced drag — the theoretical ideal that tapered and washed-out wings try to approximate." },
    { cat:"Control", q:"A “stabilator” is…",
      opts:["A backup rudder","A one-piece, all-moving horizontal tail that combines stabilizer and elevator","A wingtip device","A type of flap"], correct:1,
      why:"Instead of a fixed stabilizer with a hinged elevator, a stabilator pivots as a whole for pitch control — powerful, so it usually carries an anti-servo tab to add feel." },
    { cat:"Control", q:"On a V-tail aircraft, the “ruddervators” combine the functions of the…",
      opts:["Ailerons and flaps","Rudder and elevator","Spoilers and slats","Throttle and mixture"], correct:1,
      why:"A V-tail's two surfaces move together for pitch (like an elevator) and differentially for yaw (like a rudder) — hence “ruddervator,” saving weight and drag at the cost of some coupling." },
    { cat:"Control", q:"An anti-servo tab on a stabilator is fitted to…",
      opts:["Reduce control forces to near zero","Increase control feel and resist over-controlling","Trim the ailerons","Lock the controls on the ground"], correct:1,
      why:"Because an all-moving tail is very effective, the anti-servo tab deflects in the same direction as the surface to add resistance, giving the pilot feedback and preventing abrupt pitch inputs." },
    { cat:"Flight Mechanics", q:"Control surfaces are often “mass balanced” (weighted ahead of the hinge) to…",
      opts:["Make them heavier for strength","Prevent aerodynamic flutter","Increase their range of motion","Improve fuel economy"], correct:1,
      why:"Mass balancing moves the surface's center of gravity toward the hinge line, preventing the destructive vibration called flutter that can otherwise develop at high speed." },
    { cat:"Flight Mechanics", q:"A laminar-flow airfoil reduces drag by…",
      opts:["Being perfectly flat","Keeping the boundary layer smooth (laminar) over more of the chord","Adding vortex generators everywhere","Increasing thickness"], correct:1,
      why:"By placing the point of maximum thickness farther aft, a laminar-flow section delays the transition to turbulent flow, cutting skin-friction drag — though it demands a very clean, smooth surface." },

    /* ---- Instruments & navigation ---- */
    { cat:"Instruments", q:"“Absolute altitude” is the aircraft's height…",
      opts:["Above mean sea level","Above the terrain directly below (AGL), as read by a radar altimeter","Set on 29.92","At the tropopause"], correct:1,
      why:"Absolute altitude is height above ground level, measured by a radar (radio) altimeter — distinct from true altitude (above MSL) and pressure altitude (referenced to 29.92)." },
    { cat:"Instruments", q:"The turn coordinator / turn-and-slip indicator is driven by a…",
      opts:["Aneroid capsule","Rate gyroscope","Pitot tube","Magnetic needle"], correct:1,
      why:"A rate gyro senses the rate of turn (and roll), displaying it as the miniature aircraft's bank. The attached ball (inclinometer) separately shows coordination." },
    { cat:"Navigation", q:"A Victor (low-altitude) airway is generally how wide?",
      opts:["1 nm","8 nm (4 nm either side of centerline)","20 nm","50 nm"], correct:1,
      why:"Victor airways are 8 nm wide — 4 nm each side of the centerline — widening farther from the defining VOR. They form the low-altitude route structure below 18,000 ft." },
    { cat:"Navigation", q:"Magnetic “dip” — the compass needle's tendency to tilt toward the Earth near the magnetic poles — is the root cause of…",
      opts:["Variation","Turning and acceleration errors in the magnetic compass","Deviation","Parallax"], correct:1,
      why:"Because the field lines angle into the Earth, the compass card tilts, producing the northerly-turning and acceleration/deceleration (ANDS/UNOS) errors pilots must anticipate." },
    { cat:"Navigation", q:"Which set of definitions is correct?",
      opts:["Heading = path over the ground; track = where the nose points","Heading = where the nose points; track = actual path over the ground","They are the same thing","Track = altitude; heading = speed"], correct:1,

  function ac(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }
  function tone(freq,dur,type="square",vol=0.06){
    if(!soundOn) return; const a=ac(); if(!a) return;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.value=freq; o.connect(g); g.connect(a.destination);
    const t=a.currentTime; g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.start(t); o.stop(t+dur);
  }
